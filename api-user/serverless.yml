service: photo-gallery-user-api

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1

  environment:
    UPLOAD_BUCKET: ${param:uploadBucket, 'prod-journey-photo-upload'}
    CLOUDFRONT_URL: ${param:cloudfrontUrl, 'https://d1s3dwwzgxf5ni.cloudfront.net'}
    PHOTOS_TABLE: prod-photo-gallery-photos
    USERS_TABLE: prod-photo-gallery-users

  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${param:cognitoUserPoolId}
        audience:
          - ${param:cognitoClientId}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket, 'prod-journey-photo-upload'}/uploads/*
            - arn:aws:s3:::${param:uploadBucket, 'prod-journey-photo-upload'}/profiles/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-photos
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-photos/index/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-users

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  presignedUrl:
    handler: src/upload.presignedUrl
    events:
      - httpApi:
          path: /upload/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  savePhoto:
    handler: src/upload.savePhoto
    events:
      - httpApi:
          path: /upload/save
          method: POST
          authorizer:
            name: cognitoAuthorizer

  profileAvatarPresignedUrl:
    handler: src/profile.profileAvatarPresignedUrl
    events:
      - httpApi:
          path: /profile/avatar/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getMyProfile:
    handler: src/userProfile.getMyProfile
    events:
      - httpApi:
          path: /user/profile
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updateMyProfile:
    handler: src/userProfile.updateMyProfile
    events:
      - httpApi:
          path: /user/profile
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getPublicProfile:
    handler: src/userProfile.getPublicProfile
    events:
      - httpApi:
          path: /profile/{userId}
          method: GET

  updatePhotoVisibility:
    handler: src/photoUpdate.updatePhotoVisibility
    events:
      - httpApi:
          path: /photos/{id}
          method: PUT
          authorizer:
            name: cognitoAuthorizer
