service: photo-gallery-user-api

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1

  environment:
    # 環境ごとの値。既定値は置かない——未指定ならデプロイを失敗させる。
    # 以前はテーブル名がリテラルの prod-... で、--stage を変えても
    # 読み書き先が本番のままだった。
    UPLOAD_BUCKET: ${param:uploadBucket}
    CLOUDFRONT_URL: ${param:cloudfrontUrl}
    # 削除した実体をエッジからも消すための無効化先（LEFT-4）。
    # **未設定でも削除は成功する**（エッジの掃除だけ飛ばして警告を1行出す）
    # ——設定漏れで削除そのものを止めたくない。
    CLOUDFRONT_DISTRIBUTION_ID: ${param:cloudfrontDistributionId, ''}
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}
    # 再ビルド依頼の設定（REBUILD_*）はここには置かない。**GitHub の書き込み
    # トークンなので、provider に置くと全関数の環境変数に入る**（IAM-2）。
    # 実際に頼むのは api-user で3つ・api で2つだけなので、その関数にだけ配る。
    # 環境変数は `lambda:GetFunctionConfiguration`（読み取り権）で誰でも読めて、
    # そこからリポジトリへの書き込み → デプロイ鍵、と輪が閉じる。
    # 未認証で呼べる口にまで配る理由は無い。

  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${param:cognitoUserPoolId}
        audience:
          - ${param:cognitoClientId}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
        # 期限切れストーリーの物理削除 / 退会時の写真・アバター・カバー削除用
        - Effect: Allow
          Action:
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
        # 削除・退会・期限切れストーリーで消した実体を、エッジからも消す。
        # アップロードは max-age=31536000（1年）で配っているので、S3 から
        # 消すだけでは**URL を知っていれば取れ続ける**（GPS 入りの原本も同じ）。
        # 対象はこのアカウントの配信のみ。作成しかできない（読み書きは無い）。
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
          Resource:
            - arn:aws:cloudfront::${aws:accountId}:distribution/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            # ユーザー検索（表示名の部分一致）。ユーザー数が増えたら GSI に置き換える
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  # 注: この関数自身は再ビルドを頼まない。**savePhoto と同じ src/upload.ts に
  # 居るため**、依存を辿る守り（scripts/__tests__/rebuildTokenScope.test.ts）が
  # 「届く関数」として数える。配り先を厳密に1つにするには savePhoto を別ファイルへ
  # 切り出すことになるので、今は配る側に倒す（どちらも認証必須の投稿系）。
  presignedUrl:
    handler: src/upload.presignedUrl
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /upload/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  savePhoto:
    # 再ビルドを頼む関数は 15 秒にする（updatePhotoVisibility / deleteMyPhoto と
    # 同じ理由）。既定の 6 秒だと、**GitHub が遅いだけで写真はもう保存されて
    # いるのに 500 が返る**——画面はそれを「保存できませんでした」と読んで
    # 実体を捨てにいき、月次予算の解放（releaseMonthlyBudget）にも届かない。
    timeout: 15
    handler: src/upload.savePhoto
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /upload/save
          method: POST
          authorizer:
            name: cognitoAuthorizer

  # S3 には上がったが保存に至らなかった自分のアップロードを消す。
  # 無いと、保存に失敗した画像の実体が誰にも辿れないまま残り続ける
  # （どの削除経路も DynamoDB の項目からキーを引くため）。
  discardUpload:
    handler: src/upload.discardUpload
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /upload/discard
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  profileAvatarPresignedUrl:
    handler: src/profile.profileAvatarPresignedUrl
    events:
      - httpApi:
          path: /profile/avatar/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getMyProfile:
    handler: src/userProfile.getMyProfile
    events:
      - httpApi:
          path: /user/profile
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getMyPhotos:
    handler: src/userPhotos.getMyPhotos
    events:
      - httpApi:
          path: /user/photos
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updateMyProfile:
    handler: src/userProfile.updateMyProfile
    events:
      - httpApi:
          path: /user/profile
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getPublicProfile:
    handler: src/userProfile.getPublicProfile
    # 未認証で呼べる口。既定の共有ロール（削除権つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /profile/{userId}
          method: GET

  searchUsers:
    handler: src/userSearch.searchUsers
    # 未認証で呼べる口。既定の共有ロール（削除権つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /users/search
          method: GET

  # 曲検索。呼び出しは曲を選ぶ画面（プロフィール編集・ストーリー投稿）だけで、
  # どちらもログインが要る。未認証で開けておくと、外向き通信を1本ずつ抱えた
  # Lambda を好きなだけ起こせて、同時実行枠（アカウント全体で共有）を
  # 埋められる——退会処理など無関係な処理まで詰まる。
  musicSearch:
    handler: src/musicSearch.musicSearch
    # 外向きの通信を待つので、詰まらせない上限を明示しておく。
    #
    # ただし予約はアカウント全体の枠から取る。**いまはどの環境でも予約
    # していない**——2026-09-01、staging が予約していない状態で本番だけが
    # 10 を取ろうとして
    # 「UnreservedConcurrentExecution がアカウントの最低値(10)を下回る」
    # で UPDATE_FAILED になり、**api-user のデプロイ全体が巻き戻った**
    # （同じ回に載せていた IAM の修正まで届かなくなった）。
    # 以前は「本番と staging の両方で取ったからだ」と読んで staging 側だけ
    # 外していたが、それでは足りなかった。
    # 渡されたときだけ予約する（渡さなければプロパティごと出力されない）。
    # 総枠を測って（`diagnose` の GetAccountSettings）余裕が出たら戻すこと。
    # **この関数はログインが要る**ので、無予約でも誰でも叩けるわけではない。
    reservedConcurrency: ${param:musicSearchReserved, null}
    # **明示しておく。** 値は今までと同じ6秒（serverless の既定で、生成された
    # CloudFormation の `Timeout: 6` で確認した）。書いていないと、外向き通信の
    # 打ち切り（`musicSearch.ts` の FETCH_TIMEOUT_MS）が何と比べて短いのかが
    # コードから読めない。ここを縮めるときは向こうも一緒に見ること
    # （`musicSearch.test.ts` が両者の関係を固定している）。
    timeout: 6
    events:
      - httpApi:
          path: /music/search
          method: GET
          authorizer:
            name: cognitoAuthorizer

  # 撮影地の位置さがし（Nominatim の代理）。**画面から直接叩かない**——
  # 利用者の IP を相手に渡さず、規約が求める User-Agent をこちらで名乗る。
  # 打鍵ごとではなく「探す」を押したときだけ1回投げる（規約）。
  geocodeSearch:
    handler: src/geocodeSearch.geocodeSearch
    # AWS の権限は控えの読み書きだけで足りる。共有ロール（写真の削除・S3・
    # CloudFront まで持つ）には載せない——利用者入力を外向き URL に載せる口を
    # 最小の権限で動かす
    role: GeocodeRole
    # 外向きの通信を待つので上限を明示する（`musicSearch` と同じ 6 秒。
    # 縮めるときは `geocodeSearch.ts` の FETCH_TIMEOUT_MS も一緒に見ること）
    timeout: 6
    environment:
      # Nominatim に名乗る文字列。規約は「識別できて連絡が取れること」を求める
      GEOCODE_UA: "journey-photo.com place picker (+https://journey-photo.com/privacy)"
    events:
      - httpApi:
          path: /geocode/search
          method: GET
          authorizer:
            name: cognitoAuthorizer

  # 座標 → 地名（アップロード時の自動入力）。これまでブラウザから直接
  # Nominatim に**撮影地の座標**を送っていた。地名さがしと同じ理由でサーバー越しに
  geocodeReverse:
    handler: src/geocodeSearch.geocodeReverse
    role: GeocodeRole
    timeout: 6
    environment:
      GEOCODE_UA: "journey-photo.com place picker (+https://journey-photo.com/privacy)"
    events:
      - httpApi:
          path: /geocode/reverse
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updatePhotoVisibility:
    # 実体を消したあとに静的サイトの再ビルドを頼む（外部への HTTP）。
    # 既定の6秒だと、GitHub が遅いだけで**データはもう消えているのに
    # 500 が返る**（押し直すと今度は 404）。Lambda は実際に使った時間
    # だけ課金されるので、広げても普段の費用は変わらない。
    timeout: 15
    handler: src/photoUpdate.updatePhotoVisibility
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /photos/{id}
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  # 自分の写真を1枚消す。これまで一般ユーザーには消す手段が無く、
  # できるのは「非公開にする」（S3 の実体は残る）か「退会する」だけだった。
  # IAM は既存のもので足りる（uploads/* の s3:DeleteObject と
  # photosTable の dynamodb:DeleteItem は退会・ストーリー掃除で付与済み）。
  deleteMyPhoto:
    # 実体を消したあとに静的サイトの再ビルドを頼む（外部への HTTP）。
    # 既定の6秒だと、GitHub が遅いだけで**データはもう消えているのに
    # 500 が返る**（押し直すと今度は 404）。Lambda は実際に使った時間
    # だけ課金されるので、広げても普段の費用は変わらない。
    timeout: 15
    handler: src/photoUpdate.deleteMyPhoto
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /photos/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getStories:
    handler: src/stories.getStories
    events:
      - httpApi:
          path: /stories
          method: GET
          authorizer:
            name: cognitoAuthorizer

  # ---- 共同アルバム（案C）--------------------------------------------
  # 旅の同行者に招待リンクを1本配って、同じアルバムに写真を足してもらう。
  # 判定は src/invite.ts（DynamoDB も HTTP も触らない層）にある。

  createAlbum:
    handler: src/albums.createAlbum
    events:
      - httpApi:
          path: /albums
          method: POST
          authorizer:
            name: cognitoAuthorizer

  listAlbums:
    handler: src/albums.listAlbums
    events:
      - httpApi:
          path: /albums
          method: GET
          authorizer:
            name: cognitoAuthorizer

  renameAlbum:
    handler: src/albums.renameAlbum
    events:
      - httpApi:
          path: /albums/{id}
          method: PATCH
          authorizer:
            name: cognitoAuthorizer

  # **写真は消さない。** 消すのは束ね方（アルバム・参加の印・招待リンク）。
  deleteAlbum:
    handler: src/albums.deleteAlbum
    events:
      - httpApi:
          path: /albums/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  createInvite:
    handler: src/albums.createInvite
    events:
      - httpApi:
          path: /albums/{id}/invite
          method: POST
          authorizer:
            name: cognitoAuthorizer

  revokeInvite:
    handler: src/albums.revokeInvite
    events:
      - httpApi:
          path: /albums/{id}/invite
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  # 招待を受けて参加する。**ここはログインが要る**——閲覧は誰でも、
  # 参加はログイン。参加した人は自分のプロフィールを持ち、次の招待者になれる。
  joinAlbum:
    handler: src/albums.joinAlbum
    events:
      - httpApi:
          path: /invites/{token}/join
          method: POST
          authorizer:
            name: cognitoAuthorizer

  # **未認証で読める口。** 招待を開いた瞬間にログインを求めると、
  # 拡散の輪がそこで切れる。既定の共有ロール（削除権つき）ではなく
  # 読み取り専用へ——この口は招待の行とアルバムの行を GetItem するだけで、
  # PublicReadRole の権限（写真テーブルは GetItem のみ）に収まるように
  # キーの形を決めてある。
  getInvite:
    handler: src/albums.getInvite
    role: PublicReadRole
    events:
      - httpApi:
          path: /invites/{token}
          method: GET

  createStory:
    handler: src/stories.createStory
    events:
      - httpApi:
          path: /stories
          method: POST
          authorizer:
            name: cognitoAuthorizer

  deleteStory:
    handler: src/stories.deleteStory
    events:
      - httpApi:
          path: /stories/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getLikeCount:
    handler: src/likes.getLikeCount
    # 未認証で呼べる口。既定の共有ロール（削除権つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /photos/{id}/like
          method: GET

  # 自分がいいね済みかどうか。公開の getLikeCount とは別口にする
  # （あちらは共有キャッシュに載せているので、利用者ごとの値を混ぜられない）。
  getMyLike:
    handler: src/likes.getMyLike
    events:
      - httpApi:
          path: /user/likes/{id}
          method: GET
          authorizer:
            name: cognitoAuthorizer

  likePhoto:
    handler: src/likes.likePhoto
    # **既定の6秒では足りない。** 応答の経路で `pushNotification` を待ち、
    # そこに APNs への送信（最大2秒・TLS から張り直し）が乗った。
    # 溢れるとハード timeout で、**書けているのに 500 が返る**
    # （巻き戻しも走らない）。`postStoryReply` が同じ理由で 15 秒。
    timeout: 15
    environment:
      # **プッシュの鍵は「送る関数」にだけ配る**（provider に置かない・IAM-2）。
      # 環境変数は lambda:GetFunctionConfiguration を持つ人に見えるので、
      # 未認証で呼べる口にまで秘密を配る理由は無い。
      # **未設定でも本筋は通る**（通知は積まれ、端末に飛ばないだけ）
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APNS_TOPIC: ${param:apnsTopic, ''}
      APNS_HOST: ${param:apnsHost, ''}
    events:
      - httpApi:
          path: /photos/{id}/like
          method: POST
          authorizer:
            name: cognitoAuthorizer

  unlikePhoto:
    handler: src/likes.unlikePhoto
    events:
      - httpApi:
          path: /photos/{id}/like
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getComments:
    handler: src/comments.getComments
    # 未認証で呼べる口。既定の共有ロール（削除権つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /photos/{id}/comments
          method: GET

  postComment:
    handler: src/comments.postComment
    # **既定の6秒では足りない。** 応答の経路で `pushNotification` を待ち、
    # そこに APNs への送信（最大2秒・TLS から張り直し）が乗った。
    # 溢れるとハード timeout で、**書けているのに 500 が返る**
    # （巻き戻しも走らない）。`postStoryReply` が同じ理由で 15 秒。
    timeout: 15
    environment:
      # **プッシュの鍵は「送る関数」にだけ配る**（provider に置かない・IAM-2）。
      # 環境変数は lambda:GetFunctionConfiguration を持つ人に見えるので、
      # 未認証で呼べる口にまで秘密を配る理由は無い。
      # **未設定でも本筋は通る**（通知は積まれ、端末に飛ばないだけ）
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APNS_TOPIC: ${param:apnsTopic, ''}
      APNS_HOST: ${param:apnsHost, ''}
    events:
      - httpApi:
          path: /photos/{id}/comments
          method: POST
          authorizer:
            name: cognitoAuthorizer

  deleteComment:
    handler: src/comments.deleteComment
    events:
      - httpApi:
          path: /photos/{id}/comments/{commentId}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  followUser:
    handler: src/follow.followUser
    # **既定の6秒では足りない。** 応答の経路で `pushNotification` を待ち、
    # そこに APNs への送信（最大2秒・TLS から張り直し）が乗った。
    # 溢れるとハード timeout で、**書けているのに 500 が返る**
    # （巻き戻しも走らない）。`postStoryReply` が同じ理由で 15 秒。
    timeout: 15
    environment:
      # **プッシュの鍵は「送る関数」にだけ配る**（provider に置かない・IAM-2）。
      # 環境変数は lambda:GetFunctionConfiguration を持つ人に見えるので、
      # 未認証で呼べる口にまで秘密を配る理由は無い。
      # **未設定でも本筋は通る**（通知は積まれ、端末に飛ばないだけ）
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APNS_TOPIC: ${param:apnsTopic, ''}
      APNS_HOST: ${param:apnsHost, ''}
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: POST
          authorizer:
            name: cognitoAuthorizer

  unfollowUser:
    handler: src/follow.unfollowUser
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getFollowStats:
    handler: src/follow.getFollowStats
    # 未認証で呼べる口。既定の共有ロール（削除権つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: GET

  # その人がフォローしている人の一覧（名前つき）。**認証を要る側にした**
  # ——人の繋がりそのものであることと、1回で最大50件の GetItem を撃つため
  # （未認証の口を増やすと、同時実行10の枠を外から埋められる）
  getUserFollowing:
    handler: src/follow.getUserFollowing
    events:
      - httpApi:
          path: /users/{uid}/following
          method: GET
          authorizer:
            name: cognitoAuthorizer

  # その人をフォローしている人の一覧（`getUserFollowing` と対・同じ倒し方）
  getUserFollowers:
    handler: src/follow.getUserFollowers
    events:
      - httpApi:
          path: /users/{uid}/followers
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getMyFollowing:
    handler: src/follow.getMyFollowing
    events:
      - httpApi:
          path: /user/following
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getNotifications:
    handler: src/notifications.getNotifications
    events:
      - httpApi:
          path: /user/notifications
          method: GET
          authorizer:
            name: cognitoAuthorizer

  readNotifications:
    handler: src/notifications.readNotifications
    events:
      - httpApi:
          path: /user/notifications
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  viewStory:
    handler: src/stories.viewStory
    events:
      - httpApi:
          path: /stories/{id}/view
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getStoryViewers:
    handler: src/stories.getStoryViewers
    events:
      - httpApi:
          path: /stories/{id}/viewers
          method: GET
          authorizer:
            name: cognitoAuthorizer

  # ストーリーへの返信・リアクション。**どちらも認証必要**
  # （送る側はログイン、読めるのは投稿者だけ）。`PublicReadRole` には
  # 載せない——書き込みがあるので未認証の口の一覧に足してはいけない
  postStoryReply:
    handler: src/storyReplies.postStoryReply
    environment:
      # **プッシュの鍵は「送る関数」にだけ配る**（provider に置かない・IAM-2）。
      # 環境変数は lambda:GetFunctionConfiguration を持つ人に見えるので、
      # 未認証で呼べる口にまで秘密を配る理由は無い。
      # **未設定でも本筋は通る**（通知は積まれ、端末に飛ばないだけ）
      APNS_KEY_ID: ${param:apnsKeyId, ''}
      APNS_TEAM_ID: ${param:apnsTeamId, ''}
      APNS_PRIVATE_KEY: ${param:apnsPrivateKey, ''}
      APNS_TOPIC: ${param:apnsTopic, ''}
      APNS_HOST: ${param:apnsHost, ''}
    # 既定の6秒だと、件数の書き込みをやり直す回に枠を使い切りうる
    # （本文はもう入っているので、そこで切れると画面は失敗と読んで
    #  送り直し＝二重投稿になる）。`savePhoto` と同じ理由で広げる。
    timeout: 15
    events:
      - httpApi:
          path: /stories/{id}/replies
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getStoryReplies:
    handler: src/storyReplies.getStoryReplies
    events:
      - httpApi:
          path: /stories/{id}/replies
          method: GET
          authorizer:
            name: cognitoAuthorizer

  # ブロック。**やり取りの口を持つ以上の最低限**（返信を足した時点で、
  # ログインしていれば誰でも誰の通知にも文字を送れるようになった）
  # 不適切な投稿の通報。**ログインが要る**——未認証で受けると誰でも
  # 無限に行を作れる（このテーブルは公開一覧が全表 Scan で端から端まで読む）
  reportPhoto:
    handler: src/report.reportPhoto
    events:
      - httpApi:
          path: /photos/{id}/report
          method: POST
          authorizer:
            name: cognitoAuthorizer

  blockUser:
    handler: src/block.blockUser
    events:
      - httpApi:
          path: /users/{id}/block
          method: POST
          authorizer:
            name: cognitoAuthorizer

  unblockUser:
    handler: src/block.unblockUser
    events:
      - httpApi:
          path: /users/{id}/block
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  # プッシュ通知の宛先（端末トークン）の登録と解除。
  # **鍵は配らない**——ここは保管するだけで、送るのは上の4つ
  registerDevice:
    handler: src/devices.registerDevice
    events:
      - httpApi:
          path: /user/devices
          method: POST
          authorizer:
            name: cognitoAuthorizer

  unregisterDevice:
    handler: src/devices.unregisterDevice
    events:
      - httpApi:
          path: /user/devices
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  listBlocks:
    handler: src/block.listBlocks
    events:
      - httpApi:
          path: /user/blocks
          method: GET
          authorizer:
            name: cognitoAuthorizer

  # ストーリーの1枚をギャラリーに残す（投稿者だけ）。
  # 作るのは**下書きの写真**なので、公開・再ビルドは既存の経路が受け持つ
  keepStory:
    handler: src/storyKeep.keepStory
    events:
      - httpApi:
          path: /stories/{id}/keep
          method: POST
          authorizer:
            name: cognitoAuthorizer

  deleteAccount:
    handler: src/account.deleteAccount
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    # 既定の6秒だと、写真の多い人の退会が途中で打ち切られる。
    # 呼び出し側は HTTP のステータスを見て Cognito 側の削除に進むかを決めるので、
    # 途中で切れると「削除に失敗しました」と出たまま写真だけ半分消えた状態になる。
    # API Gateway (HTTP API) の上限が29秒なので、そこに合わせる。
    timeout: 29
    events:
      - httpApi:
          path: /user/account
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  cleanupStories:
    handler: src/stories.cleanupExpiredStories
    # S3 の削除は直列。6秒では完走できない（黙って途中で切れ、期限切れが
    # 消え残る）。索引ができて対象だけを引けるようになった今も、
    # 溜まっている回のために長めのまま残す。
    timeout: 300
    events:
      # **1時間ごと（旧: 毎日 04:00 JST）。**
      #
      # ストーリーは「24時間で消える」と言っているのに、掃除が1日1回
      # だったので**実体は最大およそ48時間ぶん公開URLで取れた**
      # ——期限が切れた直後に掃除が走ったばかりだと、次の掃除まで24時間。
      # 約束と実体の寿命が最大2倍ずれる（LEFT-5）。
      #
      # 日次にしていたのは、`queryStories` が索引の無いテーブルで
      # **全表 Scan にフォールバック**していたから（写真・コメント・
      # いいね/フォローのマーカーが同居していて、行は増える一方）。
      # 2026-09-01 に `storyFeed-expiresAt-index` を本番へ作ったので、
      # 期限切れのぶんだけを直接引ける。1時間ごとでも読む量は小さい。
      - schedule: cron(5 * * * ? *)

# ---------------------------------------------------------------------------
# 未認証で呼べる5つの口だけ、専用の最小ロールに分ける（IAM-1）
#
# 既定では **サービス内の全関数が1つのロールを共有する**ので、認証を
# 一度も通らない `getPublicProfile` / `searchUsers` / `getLikeCount` /
# `getComments` / `getFollowStats` が、写真テーブルの `DeleteItem` と
# `uploads/*`・`profiles/*` の `s3:DeleteObject`、CloudFront の
# `CreateInvalidation` まで持っていた。ハンドラのコードは使わないが、
# **これらの関数のどれか1つで任意コード実行に至る欠陥が出た瞬間、
# 認証の壁を一度も越えずに他人の写真の実体を消せる**。
#
# ここに書くのは「5つのハンドラが実際に叩いている API だけ」:
#
#   getPublicProfile  photos: GetItem / users: GetItem
#   searchUsers                 users: GetItem, Scan
#   getLikeCount      photos: GetItem
#   getComments       photos: GetItem / users: Scan（deletedUserIds）
#   getFollowStats    photos: GetItem
#
# Query は1つも使っていない（全部 主キーの GetItem）。索引も引かないので
# index/* は付けない。**足すときは呼び出し側を数えてから**——ここを
# 「ついでに」広げると、分けた意味がそのぶん減る。
#
# プラグイン（serverless-iam-roles-per-function）は使わない。この環境から
# postinstall が取得できず入らなかったのと、依存を1つ増やすより
# CloudFormation を1つ書く方が読む人に見えるため。
resources:
  Resources:
    # 地名さがし（Nominatim の代理）専用。ログと、結果の控えの読み書きだけ
    GeocodeRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-${aws:region}-geocode
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: geocode
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}

    PublicReadRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-${aws:region}-publicRead
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: publicRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # ログ。これが無いと失敗の理由がどこにも残らない
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    # 表示名の部分一致（searchUsers）と退会者の伏せ字（getComments）。
                    # どちらも GSI が無いので全表 Scan になっている
                    - dynamodb:Scan
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
