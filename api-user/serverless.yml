service: photo-gallery-user-api

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1

  environment:
    UPLOAD_BUCKET: ${param:uploadBucket, 'prod-journey-photo-upload'}
    CLOUDFRONT_URL: ${param:cloudfrontUrl, 'https://d1s3dwwzgxf5ni.cloudfront.net'}
    PHOTOS_TABLE: prod-photo-gallery-photos
    USERS_TABLE: prod-photo-gallery-users

  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${param:cognitoUserPoolId}
        audience:
          - ${param:cognitoClientId}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket, 'prod-journey-photo-upload'}/uploads/*
            - arn:aws:s3:::${param:uploadBucket, 'prod-journey-photo-upload'}/profiles/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-photos
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-photos/index/*
        # 期限切れストーリーの物理削除用
        - Effect: Allow
          Action:
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket, 'prod-journey-photo-upload'}/uploads/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-users

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  presignedUrl:
    handler: src/upload.presignedUrl
    events:
      - httpApi:
          path: /upload/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  savePhoto:
    handler: src/upload.savePhoto
    events:
      - httpApi:
          path: /upload/save
          method: POST
          authorizer:
            name: cognitoAuthorizer

  profileAvatarPresignedUrl:
    handler: src/profile.profileAvatarPresignedUrl
    events:
      - httpApi:
          path: /profile/avatar/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getMyProfile:
    handler: src/userProfile.getMyProfile
    events:
      - httpApi:
          path: /user/profile
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updateMyProfile:
    handler: src/userProfile.updateMyProfile
    events:
      - httpApi:
          path: /user/profile
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getPublicProfile:
    handler: src/userProfile.getPublicProfile
    events:
      - httpApi:
          path: /profile/{userId}
          method: GET

  musicSearch:
    handler: src/musicSearch.musicSearch
    events:
      - httpApi:
          path: /music/search
          method: GET

  updatePhotoVisibility:
    handler: src/photoUpdate.updatePhotoVisibility
    events:
      - httpApi:
          path: /photos/{id}
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getStories:
    handler: src/stories.getStories
    events:
      - httpApi:
          path: /stories
          method: GET
          authorizer:
            name: cognitoAuthorizer

  createStory:
    handler: src/stories.createStory
    events:
      - httpApi:
          path: /stories
          method: POST
          authorizer:
            name: cognitoAuthorizer

  deleteStory:
    handler: src/stories.deleteStory
    events:
      - httpApi:
          path: /stories/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getLikeCount:
    handler: src/likes.getLikeCount
    events:
      - httpApi:
          path: /photos/{id}/like
          method: GET

  likePhoto:
    handler: src/likes.likePhoto
    events:
      - httpApi:
          path: /photos/{id}/like
          method: POST
          authorizer:
            name: cognitoAuthorizer

  unlikePhoto:
    handler: src/likes.unlikePhoto
    events:
      - httpApi:
          path: /photos/{id}/like
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getComments:
    handler: src/comments.getComments
    events:
      - httpApi:
          path: /photos/{id}/comments
          method: GET

  postComment:
    handler: src/comments.postComment
    events:
      - httpApi:
          path: /photos/{id}/comments
          method: POST
          authorizer:
            name: cognitoAuthorizer

  deleteComment:
    handler: src/comments.deleteComment
    events:
      - httpApi:
          path: /photos/{id}/comments/{commentId}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getGoStatus:
    handler: src/go.getGoStatus
    events:
      - httpApi:
          path: /photos/{id}/go
          method: GET

  goPhoto:
    handler: src/go.goPhoto
    events:
      - httpApi:
          path: /photos/{id}/go
          method: POST
          authorizer:
            name: cognitoAuthorizer

  ungoPhoto:
    handler: src/go.ungoPhoto
    events:
      - httpApi:
          path: /photos/{id}/go
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getMyGoList:
    handler: src/go.getMyGoList
    events:
      - httpApi:
          path: /user/go
          method: GET
          authorizer:
            name: cognitoAuthorizer

  followUser:
    handler: src/follow.followUser
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: POST
          authorizer:
            name: cognitoAuthorizer

  unfollowUser:
    handler: src/follow.unfollowUser
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getFollowStats:
    handler: src/follow.getFollowStats
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: GET

  getMyFollowing:
    handler: src/follow.getMyFollowing
    events:
      - httpApi:
          path: /user/following
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getNotifications:
    handler: src/go.getNotifications
    events:
      - httpApi:
          path: /user/notifications
          method: GET
          authorizer:
            name: cognitoAuthorizer

  readNotifications:
    handler: src/go.readNotifications
    events:
      - httpApi:
          path: /user/notifications
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  viewStory:
    handler: src/stories.viewStory
    events:
      - httpApi:
          path: /stories/{id}/view
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getStoryViewers:
    handler: src/stories.getStoryViewers
    events:
      - httpApi:
          path: /stories/{id}/viewers
          method: GET
          authorizer:
            name: cognitoAuthorizer

  cleanupStories:
    handler: src/stories.cleanupExpiredStories
    events:
      # 毎日 04:00 JST (19:00 UTC) に期限切れストーリーを物理削除
      - schedule: cron(0 19 * * ? *)
