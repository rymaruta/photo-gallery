service: photo-gallery-user-api

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1

  environment:
    # 環境ごとの値。既定値は置かない——未指定ならデプロイを失敗させる。
    # 以前はテーブル名がリテラルの prod-... で、--stage を変えても
    # 読み書き先が本番のままだった。
    UPLOAD_BUCKET: ${param:uploadBucket}
    CLOUDFRONT_URL: ${param:cloudfrontUrl}
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}

  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${param:cognitoUserPoolId}
        audience:
          - ${param:cognitoClientId}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:Scan
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
        # 期限切れストーリーの物理削除 / 退会時の写真・アバター・カバー削除用
        - Effect: Allow
          Action:
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${param:uploadBucket}/uploads/*
            - arn:aws:s3:::${param:uploadBucket}/profiles/*
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            # ユーザー検索（表示名の部分一致）。ユーザー数が増えたら GSI に置き換える
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  presignedUrl:
    handler: src/upload.presignedUrl
    events:
      - httpApi:
          path: /upload/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  savePhoto:
    handler: src/upload.savePhoto
    events:
      - httpApi:
          path: /upload/save
          method: POST
          authorizer:
            name: cognitoAuthorizer

  profileAvatarPresignedUrl:
    handler: src/profile.profileAvatarPresignedUrl
    events:
      - httpApi:
          path: /profile/avatar/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getMyProfile:
    handler: src/userProfile.getMyProfile
    events:
      - httpApi:
          path: /user/profile
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getMyPhotos:
    handler: src/userPhotos.getMyPhotos
    events:
      - httpApi:
          path: /user/photos
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updateMyProfile:
    handler: src/userProfile.updateMyProfile
    events:
      - httpApi:
          path: /user/profile
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getPublicProfile:
    handler: src/userProfile.getPublicProfile
    events:
      - httpApi:
          path: /profile/{userId}
          method: GET

  searchUsers:
    handler: src/userSearch.searchUsers
    events:
      - httpApi:
          path: /users/search
          method: GET

  musicSearch:
    handler: src/musicSearch.musicSearch
    events:
      - httpApi:
          path: /music/search
          method: GET

  updatePhotoVisibility:
    handler: src/photoUpdate.updatePhotoVisibility
    events:
      - httpApi:
          path: /photos/{id}
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  getStories:
    handler: src/stories.getStories
    events:
      - httpApi:
          path: /stories
          method: GET
          authorizer:
            name: cognitoAuthorizer

  createStory:
    handler: src/stories.createStory
    events:
      - httpApi:
          path: /stories
          method: POST
          authorizer:
            name: cognitoAuthorizer

  deleteStory:
    handler: src/stories.deleteStory
    events:
      - httpApi:
          path: /stories/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getLikeCount:
    handler: src/likes.getLikeCount
    events:
      - httpApi:
          path: /photos/{id}/like
          method: GET

  likePhoto:
    handler: src/likes.likePhoto
    events:
      - httpApi:
          path: /photos/{id}/like
          method: POST
          authorizer:
            name: cognitoAuthorizer

  unlikePhoto:
    handler: src/likes.unlikePhoto
    events:
      - httpApi:
          path: /photos/{id}/like
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getComments:
    handler: src/comments.getComments
    events:
      - httpApi:
          path: /photos/{id}/comments
          method: GET

  postComment:
    handler: src/comments.postComment
    events:
      - httpApi:
          path: /photos/{id}/comments
          method: POST
          authorizer:
            name: cognitoAuthorizer

  deleteComment:
    handler: src/comments.deleteComment
    events:
      - httpApi:
          path: /photos/{id}/comments/{commentId}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  followUser:
    handler: src/follow.followUser
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: POST
          authorizer:
            name: cognitoAuthorizer

  unfollowUser:
    handler: src/follow.unfollowUser
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  getFollowStats:
    handler: src/follow.getFollowStats
    events:
      - httpApi:
          path: /users/{uid}/follow
          method: GET

  getMyFollowing:
    handler: src/follow.getMyFollowing
    events:
      - httpApi:
          path: /user/following
          method: GET
          authorizer:
            name: cognitoAuthorizer

  getNotifications:
    handler: src/notifications.getNotifications
    events:
      - httpApi:
          path: /user/notifications
          method: GET
          authorizer:
            name: cognitoAuthorizer

  readNotifications:
    handler: src/notifications.readNotifications
    events:
      - httpApi:
          path: /user/notifications
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  viewStory:
    handler: src/stories.viewStory
    events:
      - httpApi:
          path: /stories/{id}/view
          method: POST
          authorizer:
            name: cognitoAuthorizer

  getStoryViewers:
    handler: src/stories.getStoryViewers
    events:
      - httpApi:
          path: /stories/{id}/viewers
          method: GET
          authorizer:
            name: cognitoAuthorizer

  deleteAccount:
    handler: src/account.deleteAccount
    # 既定の6秒だと、写真の多い人の退会が途中で打ち切られる。
    # 呼び出し側は HTTP のステータスを見て Cognito 側の削除に進むかを決めるので、
    # 途中で切れると「削除に失敗しました」と出たまま写真だけ半分消えた状態になる。
    # API Gateway (HTTP API) の上限が29秒なので、そこに合わせる。
    timeout: 29
    events:
      - httpApi:
          path: /user/account
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  cleanupStories:
    handler: src/stories.cleanupExpiredStories
    # テーブル全体の Scan と S3 の直列削除。6秒では完走できない
    # （黙って途中で切れ、期限切れが消え残る）。日次バッチなので長めに取る。
    timeout: 300
    events:
      # 毎日 04:00 JST (19:00 UTC) に期限切れストーリーを物理削除
      - schedule: cron(0 19 * * ? *)
