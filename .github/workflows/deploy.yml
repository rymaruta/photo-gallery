name: Deploy Site

# main → 本番、develop → staging。
on:
  # フロントの反映は本番だけ自動。staging は手動実行（workflow_dispatch で
  # develop を選ぶ）。1回8分かかるので、push のたびには回さない。
  push:
    branches:
      - main
  workflow_dispatch:
  # 退会・写真削除・非公開のあとに API から呼ばれる。
  # 静的エクスポートなので、実体を消しても配ってある HTML は残り続ける。
  # 定期ビルドを止めている今、ここが唯一の掃除経路。
  # 連続削除は下の concurrency でまとめられる（枠を食い潰さない）。
  repository_dispatch:
    types: [site-rebuild]
  # 定期ビルド（2026-09-01 に再開。ただし**毎日ではなく週1**）。
  #
  # 止めた理由: 2026-08-20 時点で枠を 1,804/2,000 分（90%）消費しており、
  # 1回8分を毎日回すと月およそ240分＝枠の12%を「中身の変わらないビルド」に
  # 使うことになる。枠は9/1にリセットされたが、**毎日に戻す理由も無い**
  # ——目的は新しい写真の個別ページとサイトマップの生成で、写真の追加は
  # 月に数枚。削除・非公開のあとは API が repository_dispatch で叩くので、
  # 「消したものが残る」側は定期ビルドに頼っていない。
  #
  # 週1（日曜 03:00 JST = 18:00 UTC 土曜）なら月およそ32分＝枠の1.6%。
  # 写真を足した直後に出したいときは、今までどおり手動実行する。
  schedule:
    - cron: "0 18 * * 6"

# 同じ環境へのデプロイを同時に走らせない。実行中のものはキャンセルせず待たせる
# （S3 アップロードの途中で中断すると、新旧が混ざった中途半端な状態になるため）。
# 待機中の古い実行は新しい実行に置き換わる。
concurrency:
  group: deploy-site-${{ github.ref_name }}
  # 実行中のものはキャンセルしない。
  #
  # 一度 repository_dispatch のときだけ true にしたが、これは誤りだった。
  # cancel-in-progress は「新しく積まれた実行が、実行中のものを殺す」設定で、
  # repository_dispatch は既定ブランチ＝main のグループに入る。つまり
  # 「人が push したデプロイの途中で誰かが写真を1枚消すと、そのデプロイが死ぬ」。
  # 連続削除をまとめたいだけなら何もしなくてよい——GitHub は同じグループで
  # **待機中**の実行を常に1つに畳むので、8分のビルドが何本も走ることはない。
  cancel-in-progress: false

jobs:
  # ブランチから環境を決める。deploy-api.yml と同じ考え方。
  # 1つでも空なら止める（空のまま進むと本番の値にフォールバックしかねない）。
  config:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      envName: ${{ steps.pick.outputs.envName }}
      siteBucket: ${{ steps.pick.outputs.siteBucket }}
      photosTable: ${{ steps.pick.outputs.photosTable }}
      uploadBucket: ${{ steps.pick.outputs.uploadBucket }}
      siteUrl: ${{ steps.pick.outputs.siteUrl }}
      apiBaseUrl: ${{ steps.pick.outputs.apiBaseUrl }}
      userApiBaseUrl: ${{ steps.pick.outputs.userApiBaseUrl }}
      cognitoUserPoolId: ${{ steps.pick.outputs.cognitoUserPoolId }}
      cognitoClientId: ${{ steps.pick.outputs.cognitoClientId }}
      cloudfrontUrl: ${{ steps.pick.outputs.cloudfrontUrl }}
      gaId: ${{ steps.pick.outputs.gaId }}
      allowEmptyPhotos: ${{ steps.pick.outputs.allowEmptyPhotos }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          # gaId だけは空を許す（staging で解析を止めるため）
          gaId=""
          # 作りたての環境はテーブルが空。本番では絶対に立てない（0件を通すと全ページが消える）
          allowEmptyPhotos=0
          case "${{ github.ref_name }}" in
            main)
              envName=prod
              siteBucket=prod-journey-photo.com
              photosTable=prod-photo-gallery-photos
              uploadBucket=prod-journey-photo-upload
              siteUrl=https://journey-photo.com
              apiBaseUrl=https://ionr4ik01e.execute-api.ap-northeast-1.amazonaws.com
              userApiBaseUrl=https://gu7kxwdc5l.execute-api.ap-northeast-1.amazonaws.com
              cognitoUserPoolId=ap-northeast-1_ZbuhDQsWz
              cognitoClientId=21cs4cd8dkttmg3snloj72u8mu
              cloudfrontUrl=https://d1s3dwwzgxf5ni.cloudfront.net
              distributionId='${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}'
              # GA4 の測定ID。公開情報（ページソースに出る）なのでここに直書きする。
              # 一度 vars 参照にしたが、その変数が未作成で本番の解析タグが消えた。
              gaId=G-7TFN1YPBE3
              ;;
            develop)
              envName=staging
              siteBucket=staging-journey-photo.com
              photosTable=staging-photo-gallery-photos
              uploadBucket=staging-journey-photo-upload
              # staging の値も本番と同じくここに直書きする。
              # どれも公開識別子（Cognito の2つはビルド後のJSに埋め込まれて
              # ブラウザに配られる）で、秘密ではない。
              siteUrl=https://d15fn3rcaiymu9.cloudfront.net
              apiBaseUrl=https://rfq22dzchf.execute-api.ap-northeast-1.amazonaws.com
              userApiBaseUrl=https://y9f8ajacc2.execute-api.ap-northeast-1.amazonaws.com
              cognitoUserPoolId=ap-northeast-1_DSQ16c6vO
              cognitoClientId=1qjl9c8gmqidigps55jhv4foi
              cloudfrontUrl=https://d15fn3rcaiymu9.cloudfront.net
              distributionId=EF2TFEBBP24DL
              allowEmptyPhotos=1
              ;;
            *)
              echo "::error::${{ github.ref_name }} は環境に紐づいていません（main=本番 / develop=staging）"
              exit 1
              ;;
          esac
          # envName も必須。抜けるとビルドが「環境不明」になり、
          # robots.txt が全面拒否になる（そのまま本番に上げると検索から消える）。
          for k in envName siteBucket photosTable uploadBucket siteUrl apiBaseUrl userApiBaseUrl \
                   cognitoUserPoolId cognitoClientId cloudfrontUrl; do
            v="${!k}"
            if [ -z "$v" ]; then
              echo "::error::$envName の $k が未設定です。"
              exit 1
            fi
            # 埋め忘れたプレースホルダで動き出さないようにする
            case "$v" in
              *PLACEHOLDER*)
                echo "::error::$envName の $k がプレースホルダのままです（$v）。実際の値に置き換えてください。"
                exit 1
                ;;
            esac
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          # distributionId は「有無だけ」確認して値は出力しない。
          # シークレット由来の値は job output に載せられず（マスクされて空になる）、
          # 受け取った側で CloudFront の無効化が黙ってスキップされるため。
          if [ -z "$distributionId" ]; then
            echo "::error::$envName の distributionId が未設定です。"
            exit 1
          fi
          echo "gaId=$gaId" >> "$GITHUB_OUTPUT"
          echo "allowEmptyPhotos=$allowEmptyPhotos" >> "$GITHUB_OUTPUT"
          echo "envName=$envName" >> "$GITHUB_OUTPUT"
          echo "デプロイ先: $envName"

  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    needs: config
    runs-on: ubuntu-latest
    # ハングしても必ず終わらせる（GitHub の既定は6時間。実際の所要は約15分）。
    # 2026-08-19 にブラウザインストールで4時間以上ハングした実績があるため必須。
    timeout-minutes: 30

    # スモークテスト用のブラウザと OS ライブラリが入った公式イメージで動かす。
    # 以前は `playwright install --with-deps` が毎回 apt で約130個のパッケージを
    # 取りに行っており、ミラーが遅い日にタイムアウトしてデプロイが落ちていた
    # （2026-08-19 の失敗はこれ）。イメージに同梱させて apt 自体を無くす。
    # ⚠️ package.json の playwright を上げたら、このタグも同じ版に上げること。
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        timeout-minutes: 10

      # ビルド前に AWS 認証情報を設定する（ビルド内の DynamoDB → photos.json 同期に必要。
      # 認証情報がないと同期がスキップされ、コミット済みの古い photos.json でビルドされる）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # thumbSrc を持たない写真のサムネイル（512px WebP）を S3 元画像から生成する。
      # 冪等（生成済みはスキップ）なので毎回実行してよい。クライアント側の
      # サムネ生成が失敗した写真も、次のデプロイ/定期再ビルドで自動修復される。
      # ビルド前に実行することで photos.json に thumbSrc が反映される。
      - name: Generate missing thumbnails
        # ここで落ちてもデプロイは止めない。
        #
        # このステップは「表示用の補完」で、成否はサイトの正しさに関わらない。
        # 一方この後ろには build と S3 反映があり、しかも削除のたびに走る
        # site-rebuild（cron を止めた今、消えたページを S3 から消す唯一の経路）も
        # 同じ道を通る。ここで止めると「消したはずの内容が公開されたまま、
        # 直すデプロイも打てない」になる。実際その条件を一度入れかけた。
        continue-on-error: true
        run: node scripts/generate-thumbnails.js
        env:
          # このスクリプトは DynamoDB と S3 に「書く」。環境を渡し忘れると
          # 以前は本番へ書いていた（スクリプト側の既定値が本番だった）。
          PHOTOS_TABLE: ${{ needs.config.outputs.photosTable }}
          UPLOAD_BUCKET: ${{ needs.config.outputs.uploadBucket }}
          CLOUDFRONT_URL: ${{ needs.config.outputs.cloudfrontUrl }}
          # 保存する画像URLは**配信に使うURL**にする。CloudFront の既定
          # ドメインを焼き込むと、同じ画像が2つのホスト名で配信され、
          # サイトマップが両方を載せてインデックスが割れる。
          PUBLIC_BASE_URL: ${{ needs.config.outputs.siteUrl }}

      - name: Build
        run: npm run build
        env:
          # 全て公開値（シークレットではない）。config ジョブが環境ごとに解決する。
          # 以前は `secrets.X || '本番リテラル'` で、値が欠けても緑のまま
          # 本番を向いてビルドされていた。今は config 側で空を弾く。
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.config.outputs.apiBaseUrl }}
          NEXT_PUBLIC_USER_API_BASE_URL: ${{ needs.config.outputs.userApiBaseUrl }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ needs.config.outputs.cognitoUserPoolId }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ needs.config.outputs.cognitoClientId }}
          NEXT_PUBLIC_CLOUDFRONT_URL: ${{ needs.config.outputs.cloudfrontUrl }}
          # canonical・sitemap・robots の基準。staging が本番URLを名乗ると
          # 重複コンテンツになるので必ず渡す。
          NEXT_PUBLIC_SITE_URL: ${{ needs.config.outputs.siteUrl }}
          # staging では空＝解析タグを出さない
          NEXT_PUBLIC_GA_ID: ${{ needs.config.outputs.gaId }}
          # robots.txt を環境で切り替えるため（staging は全拒否）
          NEXT_PUBLIC_ENV_NAME: ${{ needs.config.outputs.envName }}
          # ビルド中の photos.json 同期先
          PHOTOS_TABLE: ${{ needs.config.outputs.photosTable }}
          # 新しい環境は写真が0件。リポジトリにコミットされている photos.json は
          # 本番の写真なので、拒否すると staging が本番の写真を並べてしまう。
          ALLOW_EMPTY_PHOTOS: ${{ needs.config.outputs.allowEmptyPhotos }}

      # ブラウザはコンテナイメージに同梱済みなので通常は即終了する。
      # package.json の playwright だけ上げてイメージのタグが古いときの保険として
      # 実行する（--with-deps は付けない。apt を走らせないことがこの構成の要点）。
      # スモークテストは本番の反映前だけ。staging では省く（Actions の枠の節約）。
      - name: Ensure browsers match the installed Playwright
        if: needs.config.outputs.envName == 'prod'
        run: npx playwright install chromium webkit
        timeout-minutes: 10

      # 実ブラウザでメニュー・モーダル・タブを実際にタップして検証。
      # 「見た目は正常だがタップできない」系の回帰（不可視オーバーレイ・
      # ハイドレーション不全・包含ブロック事故）はここで止まる。
      # Chromium だけでなく WebKit(Safari エンジン)でもタップ可能を保証する。
      # 「iOS Safari では見た目正常だが全無反応」系の回帰をデプロイ前に止めるため。
      - name: Browser smoke test (tap the real UI — Chromium + WebKit)
        if: needs.config.outputs.envName == 'prod'
        run: SMOKE_ENGINES=chromium,webkit node scripts/e2e-smoke.mjs
        timeout-minutes: 10

      - name: Deploy to S3
        timeout-minutes: 20
        env:
          # config の output 経由にしない。シークレット由来の値はマスクされて
          # 空で届き、無効化が黙ってスキップされる（実際に踏んだ）。
          #
          # `A && B || C` は使わない。本番のシークレットが空だと
          # **ステージングの配信ID**に落ち、バケットは本番を触るのに無効化は
          # ステージングへ、という一番気づきにくい壊れ方をする。
          # restrict-originals.yml が同じ罠を明文化している。
          # 環境ごとに別の変数で渡し、選んでから空を弾く。
          ENV_NAME: ${{ needs.config.outputs.envName }}
          PROD_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          STAGING_DISTRIBUTION_ID: EF2TFEBBP24DL
          SITE_BUCKET: ${{ needs.config.outputs.siteBucket }}
          SITE_URL: ${{ needs.config.outputs.siteUrl }}
          # 削除起点の掃除（退会・写真削除の repository_dispatch）では、
          # 消す量のガードを外す。**掃除が落ちる方が悪い**からで、
          # 1人が全部の写真を持っている今は退会1回で 88% が消える。
          # push / 手動実行では外さない（out/ が本番より貧しいときに止める）。
          ALLOW_BULK_DELETE: ${{ github.event_name == 'repository_dispatch' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$ENV_NAME" = "prod" ]; then
            distributionId="$PROD_DISTRIBUTION_ID"
          else
            distributionId="$STAGING_DISTRIBUTION_ID"
          fi
          if [ -z "$distributionId" ]; then
            echo "::error::$ENV_NAME の配信IDが空です。別環境のIDに落とさず、ここで止めます。"
            exit 1
          fi
          CLOUDFRONT_DISTRIBUTION_ID="$distributionId" \
            node scripts/deploy-static-site.js --bucket "$SITE_BUCKET"
