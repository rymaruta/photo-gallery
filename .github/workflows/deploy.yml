name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 6時間ごとに再ビルド（JST 03:00 / 09:00 / 15:00 / 21:00）。
    # /photo/[id] の静的ページやサイトマップに新しい写真を反映する
    # （photos.json の再同期）。アップロード直後はモーダル表示で閲覧できる。
    - cron: "0 0,6,12,18 * * *"

# 本番デプロイを同時に走らせない。実行中のものはキャンセルせず待たせる
# （S3 アップロードの途中で中断すると、新旧が混ざった中途半端な状態になるため）。
# 待機中の古い実行は新しい実行に置き換わる。
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    # ハングしても必ず終わらせる（GitHub の既定は6時間。実際の所要は約15分）。
    # 2026-08-19 にブラウザインストールで4時間以上ハングした実績があるため必須。
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        timeout-minutes: 10

      # ビルド前に AWS 認証情報を設定する（ビルド内の DynamoDB → photos.json 同期に必要。
      # 認証情報がないと同期がスキップされ、コミット済みの古い photos.json でビルドされる）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # thumbSrc を持たない写真のサムネイル（512px WebP）を S3 元画像から生成する。
      # 冪等（生成済みはスキップ）なので毎回実行してよい。クライアント側の
      # サムネ生成が失敗した写真も、次のデプロイ/定期再ビルドで自動修復される。
      # ビルド前に実行することで photos.json に thumbSrc が反映される。
      - name: Generate missing thumbnails
        run: node scripts/generate-thumbnails.js

      - name: Build
        run: npm run build
        env:
          # 全て公開値（シークレットではない）。Secrets 未設定でも既定の本番値でビルドできる。
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://ionr4ik01e.execute-api.ap-northeast-1.amazonaws.com' }}
          NEXT_PUBLIC_USER_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_USER_API_BASE_URL || 'https://gu7kxwdc5l.execute-api.ap-northeast-1.amazonaws.com' }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID || 'ap-northeast-1_ZbuhDQsWz' }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID || '21cs4cd8dkttmg3snloj72u8mu' }}
          NEXT_PUBLIC_CLOUDFRONT_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFRONT_URL || 'https://d1s3dwwzgxf5ni.cloudfront.net' }}

      # ブラウザ本体をキャッシュする。毎回ダウンロードすると所要時間が読めず、
      # ここでハングした実績があるため（キャッシュヒット時はほぼ即完了）。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install browsers for smoke test (chromium + webkit)
        run: npx playwright install --with-deps chromium webkit
        timeout-minutes: 10

      # 実ブラウザでメニュー・モーダル・タブを実際にタップして検証。
      # 「見た目は正常だがタップできない」系の回帰（不可視オーバーレイ・
      # ハイドレーション不全・包含ブロック事故）はここで止まる。
      # Chromium だけでなく WebKit(Safari エンジン)でもタップ可能を保証する。
      # 「iOS Safari では見た目正常だが全無反応」系の回帰をデプロイ前に止めるため。
      - name: Browser smoke test (tap the real UI — Chromium + WebKit)
        run: SMOKE_ENGINES=chromium,webkit node scripts/e2e-smoke.mjs
        timeout-minutes: 10

      - name: Deploy to S3
        run: node scripts/deploy-static-site.js --bucket prod-journey-photo.com
        timeout-minutes: 20
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
