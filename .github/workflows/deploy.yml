name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 毎日 03:00 JST に再ビルド。/photo/[id] の静的ページに
    # 前日アップロードされた写真を反映する（photos.json の再同期）
    - cron: "0 18 * * *"

jobs:
  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # ビルド前に AWS 認証情報を設定する（ビルド内の DynamoDB → photos.json 同期に必要。
      # 認証情報がないと同期がスキップされ、コミット済みの古い photos.json でビルドされる）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Build
        run: npm run build
        env:
          # 全て公開値（シークレットではない）。Secrets 未設定でも既定の本番値でビルドできる。
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://ionr4ik01e.execute-api.ap-northeast-1.amazonaws.com' }}
          NEXT_PUBLIC_USER_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_USER_API_BASE_URL || 'https://gu7kxwdc5l.execute-api.ap-northeast-1.amazonaws.com' }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID || 'ap-northeast-1_ZbuhDQsWz' }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID || '21cs4cd8dkttmg3snloj72u8mu' }}
          NEXT_PUBLIC_CLOUDFRONT_URL: ${{ secrets.NEXT_PUBLIC_CLOUDFRONT_URL || 'https://d1s3dwwzgxf5ni.cloudfront.net' }}

      - name: Deploy to S3
        run: node scripts/deploy-static-site.js --bucket prod-journey-photo.com
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
