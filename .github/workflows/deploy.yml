name: Deploy Site

# main → 本番、develop → staging。
# **`GITHUB_TOKEN` に何も渡さない（IAM-3）。**
# どのワークフローも `actions/checkout` 以外でトークンを使っていないのに、
# 既定の権限（リポジトリ設定次第では contents: write まで）が渡っていた。
# checkout に要るのは読み取りだけ。**渡していない権限は漏らせない**。
permissions:
  contents: read
  # 同じコミットの `Deploy API Lambdas` の結果を読むためだけ（下の api-gate）。
  # 書き込みは足さない——読めれば十分で、渡していない権限は漏らせない。
  actions: read

on:
  # フロントの反映は本番だけ自動。staging は手動実行（workflow_dispatch で
  # develop を選ぶ）。1回8分かかるので、push のたびには回さない。
  push:
    branches:
      - main
  workflow_dispatch:
  # 退会・写真削除・非公開のあとに API から呼ばれる。
  # 静的エクスポートなので、実体を消しても配ってある HTML は残り続ける。
  # 定期ビルドを止めている今、ここが唯一の掃除経路。
  # 連続削除は下の concurrency でまとめられる（枠を食い潰さない）。
  repository_dispatch:
    types: [site-rebuild]
  # 🔴 **定期ビルドは止めている**（2026-09-16・owner の指示）。
  #
  # 止めた理由: **その日に枠を 2,000/2,000 分（100%）使い切った**。
  # 以後は超過課金になる。定期ビルドは1回およそ12〜18分で、リセット（10/1）
  # までに2回（9/19・9/26）走る予定だった＝25〜37分。
  #
  # **止めても「新しい写真が世に出ない」にはならない。** 公開・削除・非公開の
  # あとは API が `repository_dispatch: site-rebuild` で叩くので、
  # そちらが主経路（`api-user/src/rebuild.ts`）。定期ビルドは**その経路が
  # 落ちたときの受け皿**だった。
  #
  # ⚠️ **受け皿が無くなったので、落ちたら誰も追いつかない。** 落ちる筋は2つ:
  #   1. `REBUILD_DISPATCH_TOKEN` の期限切れ（2026-12-11）
  #      → `.github/workflows/token-health.yml` が週1で確かめ、
  #        **残り14日を切ったら赤くする**（＝こちらは見張りが在る）
  #   2. **今月の再ビルドの予算を使い切る**（既定200本）
  #      → `Maintenance → diagnose` の「今月の再ビルドの予算」で見る
  #        （残り1割で警告。2026-09-16 に足した）
  # どちらの場合も、`Deploy Site` を**手動実行**すれば追いつく。
  #
  # あわせて失うもの: 週1のビルドは「ランナーの環境が変わっていないか」の
  # 見張りも兼ねていた（`a67496f5` が `schedule` を テスト省略の対象外に
  # している理由）。**止めている間は、その見張りも止まっている。**
  #
  # 戻すときは下の2行のコメントを外す（日曜 03:00 JST ＝ 土曜 18:00 UTC）。
  # schedule:
  #   - cron: "0 18 * * 6"

# 同じ環境へのデプロイを同時に走らせない。実行中のものはキャンセルせず待たせる
# （S3 アップロードの途中で中断すると、新旧が混ざった中途半端な状態になるため）。
# 待機中の古い実行は新しい実行に置き換わる。
concurrency:
  group: deploy-site-${{ github.ref_name }}
  # 実行中のものはキャンセルしない。
  #
  # 一度 repository_dispatch のときだけ true にしたが、これは誤りだった。
  # cancel-in-progress は「新しく積まれた実行が、実行中のものを殺す」設定で、
  # repository_dispatch は既定ブランチ＝main のグループに入る。つまり
  # 「人が push したデプロイの途中で誰かが写真を1枚消すと、そのデプロイが死ぬ」。
  # 連続削除をまとめたいだけなら何もしなくてよい——GitHub は同じグループで
  # **待機中**の実行を常に1つに畳むので、8分のビルドが何本も走ることはない。
  cancel-in-progress: false

jobs:
  # ブランチから環境を決める。deploy-api.yml と同じ考え方。
  # 1つでも空なら止める（空のまま進むと本番の値にフォールバックしかねない）。
  config:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      envName: ${{ steps.pick.outputs.envName }}
      siteBucket: ${{ steps.pick.outputs.siteBucket }}
      photosTable: ${{ steps.pick.outputs.photosTable }}
      usersTable: ${{ steps.pick.outputs.usersTable }}
      uploadBucket: ${{ steps.pick.outputs.uploadBucket }}
      siteUrl: ${{ steps.pick.outputs.siteUrl }}
      apiBaseUrl: ${{ steps.pick.outputs.apiBaseUrl }}
      userApiBaseUrl: ${{ steps.pick.outputs.userApiBaseUrl }}
      cognitoUserPoolId: ${{ steps.pick.outputs.cognitoUserPoolId }}
      cognitoClientId: ${{ steps.pick.outputs.cognitoClientId }}
      cloudfrontUrl: ${{ steps.pick.outputs.cloudfrontUrl }}
      gaId: ${{ steps.pick.outputs.gaId }}
      allowEmptyPhotos: ${{ steps.pick.outputs.allowEmptyPhotos }}
      contactEmail: ${{ steps.pick.outputs.contactEmail }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          # gaId だけは空を許す（staging で解析を止めるため）
          gaId=""
          # **問い合わせ先。** `gaId` と同じく**ここに直書きする**。
          #
          # 公開情報（`/privacy` にそのまま表示され、`MemberOnlyNotice` の
          # mailto になる）なので秘密ではない。`vars` 参照にしない理由も
          # `gaId` と同じ——**変数が未作成だと黙って空になる**。実際
          # `gaId` はそれで本番の解析タグが消えている。
          #
          # **`${{ vars.X }}` を `run:` の中に書き戻さないこと。** 値が
          # スクリプトの一部として展開されるので、アポストロフィ1つ
          # （`o'brien@example.com` は RFC 上も合法）で**ジョブが死に**、
          # 改行が入ると `$GITHUB_OUTPUT` の2行目として
          # **検証済みの siteUrl / siteBucket を後勝ちで上書きできる**
          # （どちらも実測した）。どうしても外から渡すなら `env:` 経由で。
          #
          # これが効くのは `MemberOnlyNotice`——登録の最後のトリガーが
          # 失敗して投稿権限が付かなかった人が必ず着く画面で、
          # `useMemberGate` 自身が「グループを入れ直す経路はアプリのどこにも
          # 無い。再ログインでも直らない」と書いている。**そこで唯一の出口**
          contactEmail=journey.photo.official@gmail.com
          # 打ち間違いで静かに壊れたリンクを配らない（PLACEHOLDER の検査と同じ趣旨）
          case "$contactEmail" in
            *@*.*) ;;
            *) echo "::error::contactEmail がメールアドレスの形ではありません（$contactEmail）"; exit 1 ;;
          esac
          # 作りたての環境はテーブルが空。本番では絶対に立てない（0件を通すと全ページが消える）
          allowEmptyPhotos=0
          case "${{ github.ref_name }}" in
            main)
              envName=prod
              siteBucket=prod-journey-photo.com
              photosTable=prod-photo-gallery-photos
              usersTable=prod-photo-gallery-users
              uploadBucket=prod-journey-photo-upload
              siteUrl=https://journey-photo.com
              apiBaseUrl=https://ionr4ik01e.execute-api.ap-northeast-1.amazonaws.com
              userApiBaseUrl=https://gu7kxwdc5l.execute-api.ap-northeast-1.amazonaws.com
              cognitoUserPoolId=ap-northeast-1_ZbuhDQsWz
              cognitoClientId=21cs4cd8dkttmg3snloj72u8mu
              cloudfrontUrl=https://d1s3dwwzgxf5ni.cloudfront.net
              distributionId='${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}'
              # GA4 の測定ID。公開情報（ページソースに出る）なのでここに直書きする。
              # 一度 vars 参照にしたが、その変数が未作成で本番の解析タグが消えた。
              gaId=G-7TFN1YPBE3
              ;;
            develop)
              envName=staging
              siteBucket=staging-journey-photo.com
              photosTable=staging-photo-gallery-photos
              usersTable=staging-photo-gallery-users
              uploadBucket=staging-journey-photo-upload
              # staging の値も本番と同じくここに直書きする。
              # どれも公開識別子（Cognito の2つはビルド後のJSに埋め込まれて
              # ブラウザに配られる）で、秘密ではない。
              siteUrl=https://d15fn3rcaiymu9.cloudfront.net
              apiBaseUrl=https://rfq22dzchf.execute-api.ap-northeast-1.amazonaws.com
              userApiBaseUrl=https://y9f8ajacc2.execute-api.ap-northeast-1.amazonaws.com
              cognitoUserPoolId=ap-northeast-1_DSQ16c6vO
              cognitoClientId=1qjl9c8gmqidigps55jhv4foi
              cloudfrontUrl=https://d15fn3rcaiymu9.cloudfront.net
              distributionId=EF2TFEBBP24DL
              allowEmptyPhotos=1
              ;;
            *)
              echo "::error::${{ github.ref_name }} は環境に紐づいていません（main=本番 / develop=staging）"
              exit 1
              ;;
          esac
          # envName も必須。抜けるとビルドが「環境不明」になり、
          # robots.txt が全面拒否になる（そのまま本番に上げると検索から消える）。
          for k in envName siteBucket photosTable usersTable uploadBucket siteUrl apiBaseUrl userApiBaseUrl \
                   cognitoUserPoolId cognitoClientId cloudfrontUrl; do
            v="${!k}"
            if [ -z "$v" ]; then
              echo "::error::$envName の $k が未設定です。"
              exit 1
            fi
            # 埋め忘れたプレースホルダで動き出さないようにする
            case "$v" in
              *PLACEHOLDER*)
                echo "::error::$envName の $k がプレースホルダのままです（$v）。実際の値に置き換えてください。"
                exit 1
                ;;
            esac
            echo "$k=$v" >> "$GITHUB_OUTPUT"
          done
          # distributionId は「有無だけ」確認して値は出力しない。
          # シークレット由来の値は job output に載せられず（マスクされて空になる）、
          # 受け取った側で CloudFront の無効化が黙ってスキップされるため。
          if [ -z "$distributionId" ]; then
            echo "::error::$envName の distributionId が未設定です。"
            exit 1
          fi
          echo "gaId=$gaId" >> "$GITHUB_OUTPUT"
          echo "contactEmail=$contactEmail" >> "$GITHUB_OUTPUT"
          echo "allowEmptyPhotos=$allowEmptyPhotos" >> "$GITHUB_OUTPUT"
          echo "envName=$envName" >> "$GITHUB_OUTPUT"
          echo "デプロイ先: $envName"

  # API のデプロイが失敗しているのに、フロントだけ本番へ出すのを止める。
  #
  # **2026-09-01 に実際に踏んだ。** `main` へのマージで
  # `Deploy API Lambdas` と `Deploy Site` は**別ワークフローとして並走する**。
  # api-user が UPDATE_FAILED で巻き戻ったのに、こちらは何も知らずに
  # 新しいフロントを本番へ出した。結果、新しい画面が古いAPIを叩く形になり、
  # **写真の削除が 404** になった（`DELETE /photos/{id}` が旧版に無い）。
  # PR に「API を先、フロントを後」と書いていたが、**片方が落ちたときに
  # 止まる仕掛けが無ければ、それは約束ではない**。
  #
  # **止めるのは「失敗を実際に見たとき」だけ。**
  # 見つからない・判断できない・時間切れは**通す**（警告だけ）。
  # ここで詰まらせると、API と無関係な変更まで出せなくなる——
  # 「守りを足したら、逆向きの失敗を新しく作った」を繰り返さないため。
  api-gate:
    name: API デプロイの結果を待つ
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # push 以外（手動・定期・repository_dispatch）は対象外。
    # それらは「そのコミットの API デプロイ」という相手がいない。
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: この push が API を触ったか見る
        id: touched
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 触っていなければ `Deploy API Lambdas` はそもそも起動しない
          # （あちらは api/** と api-user/** の paths フィルタ付き）。
          # その場合に「実行が無い」を待つと、必ず時間切れになる。
          changed=""
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$SHA" -- api api-user || true)
          else
            # 履歴が辿れない（force push・初回など）。分からないので「触った」に倒す
            # ——待って通す方が、見ずに出すより安い
            changed="(不明)"
          fi
          if [ -n "$changed" ]; then
            echo "touched=true" >> "$GITHUB_OUTPUT"
            echo "API を触っている:"; echo "$changed"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            echo "この push は api/ も api-user/ も触っていない。待たずに進む"
          fi

      - name: 同じコミットの API デプロイが success になるまで待つ
        if: steps.touched.outputs.touched == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="repos/$REPO/actions/workflows/deploy-api.yml/runs?head_sha=$SHA&per_page=5"
          for i in $(seq 1 60); do
            body=$(gh api "$api" 2>/dev/null || echo '')
            if [ -z "$body" ]; then
              echo "  (${i}/60) Actions API を読めなかった。次で読み直す"
              sleep 15; continue
            fi
            # **`|| echo` を付ける。** `set -euo pipefail` の下では、jq が
            # 無い・出力が JSON でない、だけでこのジョブが failure になり、
            # `deploy-frontend` が needs で止まる——**このゲート自身の不具合で
            # サイトが出せなくなる**。読めなければ「分からない」に倒す。
            status=$(echo "$body" | jq -r '.workflow_runs[0].status // "none"' 2>/dev/null || echo unknown)
            concl=$(echo "$body" | jq -r '.workflow_runs[0].conclusion // "none"' 2>/dev/null || echo unknown)
            case "$status:$concl" in
              none:*)
                echo "  (${i}/60) まだ実行が現れない";;
              completed:success)
                echo "API のデプロイは success。フロントへ進む"; exit 0;;
              completed:skipped|completed:neutral)
                echo "::warning::API のデプロイが $concl。止める理由にはしないので進む"; exit 0;;
              completed:*)
                echo "::error::同じコミットの API デプロイが **$concl** です。"
                echo "::error::API が古いままフロントだけ出すと、新しい画面が古い API を叩きます"
                echo "::error::（2026-09-01 はこれで写真の削除が 404 になりました）。"
                echo "::error::API を直してから、この Deploy Site を再実行してください。"
                exit 1;;
              *)
                echo "  (${i}/60) API のデプロイは $status";;
            esac
            sleep 15
          done
          # 15分待っても終わらない。**止めない**——見えないことは失敗ではない
          echo "::warning::15分待っても API のデプロイが終わりませんでした。結果を見ずに進みます"

  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    # api-gate は push 以外では skipped になるので `always()` で受ける。
    # **skipped と failure を混ぜない**——failure のときだけ止める。
    needs: [config, api-gate]
    if: always() && needs.config.result == 'success' && needs.api-gate.result != 'failure'
    runs-on: ubuntu-latest
    # ハングしても必ず終わらせる（GitHub の既定は6時間。実際の所要は約15分）。
    # 2026-08-19 にブラウザインストールで4時間以上ハングした実績があるため必須。
    timeout-minutes: 30

    # スモークテスト用のブラウザと OS ライブラリが入った公式イメージで動かす。
    # 以前は `playwright install --with-deps` が毎回 apt で約130個のパッケージを
    # 取りに行っており、ミラーが遅い日にタイムアウトしてデプロイが落ちていた
    # （2026-08-19 の失敗はこれ）。イメージに同梱させて apt 自体を無くす。
    # ⚠️ package.json の playwright を上げたら、このタグも同じ版に上げること。
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    # **コンテナの中では `run:` の既定シェルが `sh`（dash）になる。**
    # ランナー直上なら bash なので、同じ書き方でも通ってしまう——
    # `set -euo pipefail` は dash に無い `pipefail` を含むので
    # `set: Illegal option -o pipefail` で**1行目から落ちる**。
    # 2026-08-19 にこのジョブをコンテナへ移し、8/21 に `set -euo pipefail` を
    # 足した結果、**それ以降サイトのデプロイは staging も本番も
    # S3 へ出す手前で失敗し続けていた**（ビルドは通るので、ログを最後まで
    # 見ないと成功に見える）。ここで shell を明示して、書き方の前提を戻す。
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # **写真の投稿・削除で起動された回はテストを飛ばす。**
      #
      # `repository_dispatch` は API（Lambda）が「写真が増えた／消えた」と
      # 頼んでくる経路で、**コードは1行も変わっていない**——その commit の
      # テストは、この同じジョブが push のときに既に通している。
      # 同じ木に対する2回目で、実測 4分34秒（1回7分02秒のうち65%）を使う。
      #
      # 効き方: 1回7分 → 約2分。月の枠2,000分に対して、再ビルド200本が
      # 1,400分（70%）から 400分（20%）になる。**この枠は「投稿が世に出る
      # 回数」の上限そのもの**（`REBUILD_MONTHLY_MAX`）なので、ここを削ると
      # そのまま投稿できる量が増える。
      #
      # **飛ばさない場合**: push（コードが変わっている）・schedule・
      # 手動実行（`workflow_dispatch`。壊れていないか確かめたいときに使う）。
      # **上限は「ハングを止める」ためのもので、遅さを罰するためではない。**
      # 10分では足りなくなった——実測（Deploy Site の `Run tests`）:
      #
      #     run 370（2026-09-12・約4,790件）  8分59秒  ← 上限まで残り1分
      #     run 374（2026-09-13・5,025件）    **10分で打ち切り**（全部 ✓ のまま）
      #
      # 余裕が既に1分しか無く、テストが約230件増えた周で超えた。落ちたのは
      # **テストではなく上限**で、ログの最後まで ✓ が並んでいる。
      # 20分にしても「4時間ハングした」実績（ジョブ側 30分の理由）は
      # 変わらず捕まえられる。ジョブ全体が30分なので、ここを30以上にしても
      # 意味が無い（先にジョブが落ちる）。
      - name: Run tests
        if: github.event_name != 'repository_dispatch'
        run: npm test
        timeout-minutes: 20

      # ビルド前に AWS 認証情報を設定する（ビルド内の DynamoDB → photos.json 同期に必要。
      # 認証情報がないと同期がスキップされ、コミット済みの古い photos.json でビルドされる）
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      # thumbSrc を持たない写真のサムネイル（512px WebP）を S3 元画像から生成する。
      # 冪等（生成済みはスキップ）なので毎回実行してよい。クライアント側の
      # サムネ生成が失敗した写真も、次のデプロイ/定期再ビルドで自動修復される。
      # ビルド前に実行することで photos.json に thumbSrc が反映される。
      - name: Generate missing thumbnails
        # ここで落ちてもデプロイは止めない。
        #
        # このステップは「表示用の補完」で、成否はサイトの正しさに関わらない。
        # 一方この後ろには build と S3 反映があり、しかも削除のたびに走る
        # site-rebuild（cron を止めた今、消えたページを S3 から消す唯一の経路）も
        # 同じ道を通る。ここで止めると「消したはずの内容が公開されたまま、
        # 直すデプロイも打てない」になる。実際その条件を一度入れかけた。
        continue-on-error: true
        run: node scripts/generate-thumbnails.js
        env:
          # このスクリプトは DynamoDB と S3 に「書く」。環境を渡し忘れると
          # 以前は本番へ書いていた（スクリプト側の既定値が本番だった）。
          PHOTOS_TABLE: ${{ needs.config.outputs.photosTable }}
          UPLOAD_BUCKET: ${{ needs.config.outputs.uploadBucket }}
          CLOUDFRONT_URL: ${{ needs.config.outputs.cloudfrontUrl }}
          # 保存する画像URLは**配信に使うURL**にする。CloudFront の既定
          # ドメインを焼き込むと、同じ画像が2つのホスト名で配信され、
          # サイトマップが両方を載せてインデックスが割れる。
          PUBLIC_BASE_URL: ${{ needs.config.outputs.siteUrl }}

      - name: Build
        run: npm run build
        env:
          # 全て公開値（シークレットではない）。config ジョブが環境ごとに解決する。
          # 以前は `secrets.X || '本番リテラル'` で、値が欠けても緑のまま
          # 本番を向いてビルドされていた。今は config 側で空を弾く。
          NEXT_PUBLIC_API_BASE_URL: ${{ needs.config.outputs.apiBaseUrl }}
          NEXT_PUBLIC_USER_API_BASE_URL: ${{ needs.config.outputs.userApiBaseUrl }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ needs.config.outputs.cognitoUserPoolId }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ needs.config.outputs.cognitoClientId }}
          NEXT_PUBLIC_CLOUDFRONT_URL: ${{ needs.config.outputs.cloudfrontUrl }}
          # canonical・sitemap・robots の基準。staging が本番URLを名乗ると
          # 重複コンテンツになるので必ず渡す。
          NEXT_PUBLIC_SITE_URL: ${{ needs.config.outputs.siteUrl }}
          # staging では空＝解析タグを出さない
          NEXT_PUBLIC_GA_ID: ${{ needs.config.outputs.gaId }}
          # 未設定なら空＝「問い合わせる」を出さない（今までどおり）
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ needs.config.outputs.contactEmail }}
          # robots.txt を環境で切り替えるため（staging は全拒否）
          NEXT_PUBLIC_ENV_NAME: ${{ needs.config.outputs.envName }}
          # ビルド中の photos.json 同期先
          PHOTOS_TABLE: ${{ needs.config.outputs.photosTable }}
          # 写真に焼かれた表示名を、users テーブルの今の値へ揃えるために引く。
          # **渡し忘れると症状が出ない**——スクリプトは警告1行で素通りし、
          # ビルドは緑のまま旧名が焼き直される（実際にこの形で1周落とした）。
          USERS_TABLE: ${{ needs.config.outputs.usersTable }}
          # 新しい環境は写真が0件。リポジトリにコミットされている photos.json は
          # 本番の写真なので、拒否すると staging が本番の写真を並べてしまう。
          ALLOW_EMPTY_PHOTOS: ${{ needs.config.outputs.allowEmptyPhotos }}

      # ブラウザはコンテナイメージに同梱済みなので通常は即終了する。
      # package.json の playwright だけ上げてイメージのタグが古いときの保険として
      # 実行する（--with-deps は付けない。apt を走らせないことがこの構成の要点）。
      # スモークテストは本番の反映前だけ。staging では省く（Actions の枠の節約）。
      - name: Ensure browsers match the installed Playwright
        if: needs.config.outputs.envName == 'prod'
        run: npx playwright install chromium webkit
        timeout-minutes: 10

      # 実ブラウザでメニュー・モーダル・タブを実際にタップして検証。
      # 「見た目は正常だがタップできない」系の回帰（不可視オーバーレイ・
      # ハイドレーション不全・包含ブロック事故）はここで止まる。
      # Chromium だけでなく WebKit(Safari エンジン)でもタップ可能を保証する。
      # 「iOS Safari では見た目正常だが全無反応」系の回帰をデプロイ前に止めるため。
      - name: Browser smoke test (tap the real UI — Chromium + WebKit)
        if: needs.config.outputs.envName == 'prod'
        run: SMOKE_ENGINES=chromium,webkit node scripts/e2e-smoke.mjs
        env:
          # ログイン済みの画面を開くのに要る（`localStorage` の鍵）。
          # 渡さないとスモークの [7] が赤くなる（黙って飛ばさない）
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ${{ needs.config.outputs.cognitoClientId }}
        timeout-minutes: 10

      - name: Deploy to S3
        timeout-minutes: 20
        env:
          # config の output 経由にしない。シークレット由来の値はマスクされて
          # 空で届き、無効化が黙ってスキップされる（実際に踏んだ）。
          #
          # `A && B || C` は使わない。本番のシークレットが空だと
          # **ステージングの配信ID**に落ち、バケットは本番を触るのに無効化は
          # ステージングへ、という一番気づきにくい壊れ方をする。
          # restrict-originals.yml が同じ罠を明文化している。
          # 環境ごとに別の変数で渡し、選んでから空を弾く。
          ENV_NAME: ${{ needs.config.outputs.envName }}
          PROD_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
          STAGING_DISTRIBUTION_ID: EF2TFEBBP24DL
          SITE_BUCKET: ${{ needs.config.outputs.siteBucket }}
          SITE_URL: ${{ needs.config.outputs.siteUrl }}
          # 削除起点の掃除（退会・写真削除の repository_dispatch）では、
          # 消す量のガードを外す。**掃除が落ちる方が悪い**からで、
          # 1人が全部の写真を持っている今は退会1回で 88% が消える。
          # push / 手動実行では外さない（out/ が本番より貧しいときに止める）。
          ALLOW_BULK_DELETE: ${{ github.event_name == 'repository_dispatch' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$ENV_NAME" = "prod" ]; then
            distributionId="$PROD_DISTRIBUTION_ID"
          else
            distributionId="$STAGING_DISTRIBUTION_ID"
          fi
          if [ -z "$distributionId" ]; then
            echo "::error::$ENV_NAME の配信IDが空です。別環境のIDに落とさず、ここで止めます。"
            exit 1
          fi
          CLOUDFRONT_DISTRIBUTION_ID="$distributionId" \
            node scripts/deploy-static-site.js --bucket "$SITE_BUCKET"
