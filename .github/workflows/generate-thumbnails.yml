name: Generate Thumbnails (migration)

# 既存写真のサムネイル一括生成（手動実行のみ）。
# thumbSrc を持たない写真の S3 元画像から 512px WebP を生成して保存し、
# DynamoDB に thumbSrc を書き込む。冪等なので何度実行しても安全。
# 実行後はサイトの再ビルド（Deploy to Production）で photos.json に反映される。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        # 自由入力だと `=== "1"` の比較を外れた値（"true" など）が
        # **本番に書く側**に落ちる。選ぶだけにして取り違えを無くす。
        description: "対象一覧の確認のみにするか"
        type: choice
        options:
          - "1"   # 確認のみ（既定）
          - "0"   # 実際に生成して DynamoDB に書く
        required: true
        default: "1"

# 画像処理が重なると S3 への書き込みが競合するため同時実行しない。
concurrency:
  group: generate-thumbnails
  cancel-in-progress: false

# これらは本番専用の保守ワークフロー。スクリプト側の「既定で本番」を撤去したので、
# ここで環境を明示する（渡し忘れたらスクリプトが止まる）。
env:
  AWS_REGION: ap-northeast-1
  PHOTOS_TABLE: prod-photo-gallery-photos
  USERS_TABLE: prod-photo-gallery-users
  UPLOAD_BUCKET: prod-journey-photo-upload
  CLOUDFRONT_URL: https://d1s3dwwzgxf5ni.cloudfront.net
  # 保存する画像URLの土台は**配信に使うURL**。これを渡さないと CloudFront の
  # 既定ドメインが DynamoDB に恒久保存され、同じ画像が2つのホスト名で配信されて
  # サイトマップのインデックスが割れる（実測30件中11件がそうなっていた）。
  # deploy.yml は渡している。手動の保守経路だけ抜けていると、後片付け
  # （maintenance の normalize-image-urls）をしてもここを流すたびにまた割れる。
  PUBLIC_BASE_URL: https://journey-photo.com

jobs:
  generate:
    name: Generate thumbnails for existing photos
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Generate thumbnails
        run: node scripts/generate-thumbnails.js
        env:
          DRY_RUN: ${{ inputs.dry_run }}
