name: Diagnose CDN

# 手動実行のみ。読み取り専用の診断で、AWS の設定は一切変更しない。
# 「初回アクセスで CSS が当たらない」の原因を実データで確かめるために使う。
# **`GITHUB_TOKEN` に何も渡さない（IAM-3）。**
# どのワークフローも `actions/checkout` 以外でトークンを使っていないのに、
# 既定の権限（リポジトリ設定次第では contents: write まで）が渡っていた。
# checkout に要るのは読み取りだけ。**渡していない権限は漏らせない**。
permissions:
  contents: read

on:
  workflow_dispatch:

# これらは本番専用の保守ワークフロー。スクリプト側の「既定で本番」を撤去したので、
# ここで環境を明示する（渡し忘れたらスクリプトが止まる）。
env:
  AWS_REGION: ap-northeast-1
  PHOTOS_TABLE: prod-photo-gallery-photos
  USERS_TABLE: prod-photo-gallery-users
  UPLOAD_BUCKET: prod-journey-photo-upload
  CLOUDFRONT_URL: https://d1s3dwwzgxf5ni.cloudfront.net
  SITE_URL: https://journey-photo.com

jobs:
  diagnose:
    name: Diagnose CDN delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # WAF のルール確認用（通常のビルドには不要なのでリポジトリには入れない）
      - name: Install WAF client (diagnostic only)
        run: npm install --no-save @aws-sdk/client-wafv2


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Diagnose
        run: node scripts/diagnose-cdn.js
        timeout-minutes: 10
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
