name: Diagnose CDN

# 手動実行のみ。読み取り専用の診断で、AWS の設定は一切変更しない。
# 「初回アクセスで CSS が当たらない」の原因を実データで確かめるために使う。
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Diagnose CDN delivery
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # WAF のルール確認用（通常のビルドには不要なのでリポジトリには入れない）
      - name: Install WAF client (diagnostic only)
        run: npm install --no-save @aws-sdk/client-wafv2

      # 実ページと同じアセット一覧を得るためにビルドする（並列取得の再現に使う）
      - name: Build (for asset list)
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://ionr4ik01e.execute-api.ap-northeast-1.amazonaws.com
          NEXT_PUBLIC_USER_API_BASE_URL: https://gu7kxwdc5l.execute-api.ap-northeast-1.amazonaws.com
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ap-northeast-1_ZbuhDQsWz
          NEXT_PUBLIC_COGNITO_CLIENT_ID: 21cs4cd8dkttmg3snloj72u8mu
          NEXT_PUBLIC_CLOUDFRONT_URL: https://d1s3dwwzgxf5ni.cloudfront.net

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Diagnose
        run: node scripts/diagnose-cdn.js
        timeout-minutes: 10
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
