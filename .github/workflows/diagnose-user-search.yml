name: Diagnose user search

# 手動実行のみ・読み取り専用。
# 「表示名で検索しても出てこない」原因を実データで切り分ける。
# **`GITHUB_TOKEN` に何も渡さない（IAM-3）。**
# どのワークフローも `actions/checkout` 以外でトークンを使っていないのに、
# 既定の権限（リポジトリ設定次第では contents: write まで）が渡っていた。
# checkout に要るのは読み取りだけ。**渡していない権限は漏らせない**。
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      query:
        description: "検索語（例: 旅人）"
        type: string
        default: "旅人"

# これらは本番専用の保守ワークフロー。スクリプト側の「既定で本番」を撤去したので、
# ここで環境を明示する（渡し忘れたらスクリプトが止まる）。
env:
  AWS_REGION: ap-northeast-1
  PHOTOS_TABLE: prod-photo-gallery-photos
  USERS_TABLE: prod-photo-gallery-users
  UPLOAD_BUCKET: prod-journey-photo-upload
  CLOUDFRONT_URL: https://d1s3dwwzgxf5ni.cloudfront.net

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
      - run: node scripts/diagnose-user-search.js
        timeout-minutes: 5
        env:
          SEARCH_QUERY: ${{ inputs.query }}
