name: Keyless aerial imagery visual proof (draft)

# Only this explicitly approved map prototype; NEVER deploy. Owner's other
# workflows remain manual. One read-only screenshot job for the PR branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [design/cinematic-map-preview-20260924]
    paths:
      - ".github/workflows/map-real-screenshot.yml"
      - "app/components/PhotoMap.tsx"
      - "app/map/**"
      - "app/globals.css"

permissions:
  contents: read

jobs:
  screenshot:
    if: github.head_ref == 'design/free-imagery-map-20260924' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly the repository lockfile
        run: npm ci
      - name: Typecheck the committed source
        run: npm run type-check
      - name: Lint the map changes
        run: npx eslint app/components/PhotoMap.tsx app/map/loadVectorBasemap.ts app/map/MapPageClient.tsx
      - name: Existing map, sheet and privacy regression tests
        run: npx vitest run app/map/__tests__/page.test.tsx app/map/__tests__/MapPhotoSheet.test.tsx app/map/__tests__/freeImagery.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create test-only route on the runner (NEVER committed or deployed)
        shell: bash
        run: |
          mkdir -p app/map/design-proof
          cat > app/map/design-proof/page.tsx <<'TSX'
          import Proof from "./Proof";
          export default function Page() { return <Proof />; }
          TSX
          cat > app/map/design-proof/Proof.tsx <<'TSX'
          "use client";
          import React from "react";
          import MapPageClient from "../MapPageClient";
          import type { SpotPin } from "../../../lib/data/spotLink";
          const SPOTS: SpotPin[] = [
            { slug: "proof-fuji-a", name: "河口湖周辺A（検証用）", region: "山梨県・検証用", summary: "空中写真とスポットカードの動作を確認するためだけのCIデータです。", lat: 35.502, lng: 138.755, cover: null },
            { slug: "proof-fuji-b", name: "河口湖周辺B（検証用）", region: "山梨県・検証用", lat: 35.503, lng: 138.759, cover: null },
            { slug: "proof-fuji-c", name: "河口湖周辺C（検証用）", region: "山梨県・検証用", lat: 35.504, lng: 138.758, cover: null },
          ];
          export default function Proof() {
            return (
              <div>
                <p className="px-4 pt-2 text-xs text-link">CI TEST DATA ONLY / NOT A PUBLISHED SPOT GUIDE</p>
                {/* Render the actual /map client, not a hand-made lookalike. Only
                    its spot props are fixtures, created on this CI runner. */}
                <MapPageClient spots={SPOTS} />
              </div>
            );
          }
          TSX
      - name: Start real Next.js application locally
        shell: bash
        run: |
          (npm run dev -- --hostname 127.0.0.1 > /tmp/jp-next-map.log 2>&1 &)
          for i in $(seq 1 75); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/map/design-proof; then exit 0; fi
            sleep 2
          done
          cat /tmp/jp-next-map.log
          exit 1
      - name: Capture REAL Japan and official national imagery screenshots
        shell: bash
        run: |
          mkdir -p /tmp/journey-real-map-screens
          cat > /tmp/journey-real-map-screens/proof.cjs <<'JS'
          const { chromium } = require(process.cwd() + "/node_modules/playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failed = false;
            for (const [name, width, height] of [["mobile", 390, 844], ["desktop", 1280, 800]]) {
              const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
              const errors = [];
              const gsiTileResponses = [];
              const gsiTileFailures = [];
              page.on("pageerror", (err) => errors.push(String(err)));
              page.on("response", (response) => {
                if (response.url().includes("cyberjapandata.gsi.go.jp/xyz/")) {
                  if (response.status() === 200) gsiTileResponses.push(response.url());
                  else gsiTileFailures.push(response.status() + " " + response.url());
                }
              });
              page.on("requestfailed", (request) => {
                if (request.url().includes("cyberjapandata.gsi.go.jp/xyz/"))
                  gsiTileFailures.push(String(request.failure()?.errorText) + " " + request.url());
              });
              await page.goto("http://127.0.0.1:3000/map/design-proof#16/35.502/138.755", { waitUntil: "domcontentloaded", timeout: 90000 });
              try {
                await page.locator('[data-basemap="free-imagery-ready"]').waitFor({ timeout: 65000 });
              } catch {
                failed = true;
                console.error(name + " did not start free geographic imagery. State: " + await page.locator(".journey-photo-map").getAttribute("data-basemap"));
              }
              // The #16/35.502/138.755 permalink uses PhotoMap's genuine
              // initial-view logic and must request native orthophoto z14-18.
              // Avoid guesswork about fitBounds zoom and button animation.
              await page.waitForTimeout(5000);
              console.log(name + " GSI OK samples", gsiTileResponses.slice(-10));
              console.log(name + " GSI failure samples", gsiTileFailures.slice(-10));
              const actualOrthophoto = gsiTileResponses.filter((url) => url.includes("/xyz/seamlessphoto/"));
              if (!actualOrthophoto.length) {
                failed = true;
                console.error(name + " received NO real Japanese orthophoto tiles HTTP 200; not a verified aerial screenshot");
              } else console.log(name + " GSI orthophoto HTTP 200:", actualOrthophoto.length);
              await page.screenshot({ path: "/tmp/journey-real-map-screens/" + name + "-JAPAN-REAL-ORTHOPHOTO.png", fullPage: true });
              const pin = page.locator(".spot-map-pin-icon").first();
              if (await pin.count()) {
                await pin.click({ timeout: 10000 });
                await page.screenshot({ path: "/tmp/journey-real-map-screens/" + name + "-selected-JAPAN-REAL-ORTHOPHOTO.png", fullPage: true });
              } else { failed = true; console.error(name + " has no real official pin"); }
              if (errors.length) { failed = true; console.error(name + " errors:", errors.slice(0, 6)); }
              await page.close();
              // Each overseas screenshot must receive a genuine image from its
              // OWN national mapping agency. A successful map load alone is
              // not evidence of an orthophoto; never publish an unverified shot.
              const overseas = [
                { slug: "US", hash: "#13/40.7484/-73.9857", provider: "basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/" },
                { slug: "FR", hash: "#13/48.8584/2.2945", provider: "data.geopf.fr/wmts?" },
                { slug: "ES", hash: "#13/40.4168/-3.7038", provider: "www.ign.es/wmts/pnoa-ma?" },
              ];
              for (const country of overseas) {
                const foreign = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
                const images = [];
                const foreignErrors = [];
                foreign.on("pageerror", (error) => foreignErrors.push(String(error)));
                foreign.on("response", (response) => {
                  if (response.url().includes(country.provider) && response.status() === 200
                    && (response.headers()["content-type"] || "").toLowerCase().startsWith("image/"))
                    images.push(response.url());
                });
                try {
                  await foreign.goto("http://127.0.0.1:3000/map/design-proof" + country.hash,
                    { waitUntil: "domcontentloaded", timeout: 90000 });
                  await foreign.locator('[data-basemap="free-imagery-ready"]').waitFor({ timeout: 65000 });
                  await foreign.waitForTimeout(5000);
                  if (!images.length || foreignErrors.length) {
                    failed = true;
                    console.error(name, country.slug, "NO VERIFIED official imagery response or browser errors",
                      { images: images.length, errors: foreignErrors.slice(0, 5) });
                  } else {
                    await foreign.screenshot({ path: "/tmp/journey-real-map-screens/" + name + "-" + country.slug + "-OFFICIAL-IMAGERY.png", fullPage: true });
                    console.log(name, country.slug, "official image HTTP 200:", images.length);
                  }
                } catch (error) { failed = true; console.error(name, country.slug, String(error)); }
                finally { await foreign.close(); }
              }
            }
            await browser.close();
            if (failed) process.exitCode = 1;
          })().catch(err => { console.error(err); process.exitCode = 1; });
          JS
          node /tmp/journey-real-map-screens/proof.cjs
      - name: Upload exact real-app screenshot evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-photo-free-imagery-proof
          path: /tmp/journey-real-map-screens/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Show map server diagnostics on failure
        if: failure()
        run: tail -150 /tmp/jp-next-map.log || true
