name: Free USGS overseas real-map screenshots (draft)

# Only this explicitly approved map prototype; NEVER deploy. Owner's other
# workflows remain manual. One read-only screenshot job for the PR branch.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [design/free-imagery-map-20260924]
    paths:
      - ".github/workflows/map-real-screenshot.yml"
      - "app/components/PhotoMap.tsx"
      - "app/map/**"
      - "app/globals.css"

permissions:
  contents: read

jobs:
  screenshot:
    if: github.head_ref == 'design/world-public-imagery-20260924' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exactly the repository lockfile
        run: npm ci
      - name: Typecheck the committed source
        run: npm run type-check
      - name: Lint the map changes
        run: npx eslint app/components/PhotoMap.tsx app/map/loadVectorBasemap.ts app/map/MapPageClient.tsx
      - name: Existing map, sheet and privacy regression tests
        run: npx vitest run app/map/__tests__/page.test.tsx app/map/__tests__/MapPhotoSheet.test.tsx app/map/__tests__/freeImagery.test.ts app/map/__tests__/worldPublicImagery.test.ts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Create test-only route on the runner (NEVER committed or deployed)
        shell: bash
        run: |
          mkdir -p app/map/design-proof
          cat > app/map/design-proof/page.tsx <<'TSX'
          import Proof from "./Proof";
          export default function Page() { return <Proof />; }
          TSX
          cat > app/map/design-proof/Proof.tsx <<'TSX'
          "use client";
          import React from "react";
          import MapPageClient from "../MapPageClient";
          import type { SpotPin } from "../../../lib/data/spotLink";
          const SPOTS: SpotPin[] = [
            { slug: "proof-big-sur-a", name: "Big Sur A (CI TEST ONLY)", region: "United States / CI test", summary: "Non-published location marker used only for image-loading verification.", lat: 36.2704, lng: -121.8081, cover: null },
            { slug: "proof-big-sur-b", name: "Big Sur B (CI TEST ONLY)", region: "United States / CI test", lat: 36.2712, lng: -121.8068, cover: null },
            { slug: "proof-big-sur-c", name: "Big Sur C (CI TEST ONLY)", region: "United States / CI test", lat: 36.2699, lng: -121.8072, cover: null },
          ];
          export default function Proof() {
            return (
              <div>
                <p className="px-4 pt-2 text-xs text-link">CI TEST DATA ONLY / NOT A PUBLISHED SPOT GUIDE</p>
                {/* Render the actual /map client, not a hand-made lookalike. Only
                    its spot props are fixtures, created on this CI runner. */}
                <MapPageClient spots={SPOTS} />
              </div>
            );
          }
          TSX
      - name: Start real Next.js application locally
        shell: bash
        run: |
          (npm run dev -- --hostname 127.0.0.1 > /tmp/jp-next-map.log 2>&1 &)
          for i in $(seq 1 75); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:3000/map/design-proof; then exit 0; fi
            sleep 2
          done
          cat /tmp/jp-next-map.log
          exit 1
      - name: Capture REAL vector tile map screenshots (not schematic HTML)
        shell: bash
        run: |
          mkdir -p /tmp/journey-real-map-screens
          cat > /tmp/journey-real-map-screens/proof.cjs <<'JS'
          const { chromium } = require(process.cwd() + "/node_modules/playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            let failed = false;
            for (const [name, width, height] of [["mobile", 390, 844], ["desktop", 1280, 800]]) {
              const page = await browser.newPage({ viewport: { width, height }, deviceScaleFactor: 1 });
              const errors = [];
              const usgsTileResponses = [];
              const usgsTileFailures = [];
              page.on("pageerror", (err) => errors.push(String(err)));
              page.on("response", (response) => {
                if (response.url().includes("basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/")) {
                  if (response.status() === 200 && (response.headers()["content-type"] ?? "").startsWith("image/")) usgsTileResponses.push(response.url());
                  else usgsTileFailures.push(response.status() + " " + response.url());
                }
              });
              page.on("requestfailed", (request) => {
                if (request.url().includes("basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/"))
                  usgsTileFailures.push(String(request.failure()?.errorText) + " " + request.url());
              });
              await page.goto("http://127.0.0.1:3000/map/design-proof#16/36.2704/-121.8081", { waitUntil: "domcontentloaded", timeout: 90000 });
              try {
                await page.locator('[data-basemap="free-imagery-ready"]').waitFor({ timeout: 65000 });
              } catch {
                failed = true;
                console.error(name + " did not start free geographic imagery. State: " + await page.locator(".journey-photo-map").getAttribute("data-basemap"));
              }
              // Actual American coordinates, government provider, z16 (native).
              // Readiness alone is insufficient: require HTTP 200 image tiles.
              await page.waitForTimeout(5000);
              console.log(name + " USGS OK samples", usgsTileResponses.slice(-10));
              console.log(name + " USGS failure samples", usgsTileFailures.slice(-10));
              if (!usgsTileResponses.length) {
                failed = true;
                console.error(name + " received NO real USGS image tiles HTTP 200; cannot call this an overseas aerial screenshot");
              } else console.log(name + " USGS orthophoto HTTP 200:", usgsTileResponses.length);
              await page.screenshot({ path: "/tmp/journey-real-map-screens/" + name + "-USGS-REAL-ORTHOPHOTO.png", fullPage: true });
              const pin = page.locator(".spot-map-pin-icon").first();
              if (await pin.count()) {
                await pin.click({ timeout: 10000 });
                await page.screenshot({ path: "/tmp/journey-real-map-screens/" + name + "-selected-USGS-REAL-ORTHOPHOTO.png", fullPage: true });
              } else { failed = true; console.error(name + " has no real official pin"); }
              if (errors.length) { failed = true; console.error(name + " errors:", errors.slice(0, 6)); }
              await page.close();
            }
            await browser.close();
            if (failed) process.exitCode = 1;
          })().catch(err => { console.error(err); process.exitCode = 1; });
          JS
          node /tmp/journey-real-map-screens/proof.cjs
      - name: Upload exact real-app screenshot evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-photo-world-usgs-real-imagery
          path: /tmp/journey-real-map-screens/*.png
          if-no-files-found: warn
          retention-days: 3
      - name: Show map server diagnostics on failure
        if: failure()
        run: tail -150 /tmp/jp-next-map.log || true
