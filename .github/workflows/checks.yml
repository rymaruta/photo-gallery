name: Checks

# develop に入るフロント・ライブラリ・スクリプトの変更を検査する。
#
# これが無かった頃、develop への push で走る CI は
# `deploy-api.yml`（api/** api-user/** のみ）だけだった。
# つまり app/** lib/** scripts/** .github/** の変更は**検査ゼロ**で、
# ローカル実行だけが関門になっていた。実際に eslint を通さずに
# push した回があり、誰も気づけなかった（5b73dca）。
#
# ビルドも Playwright も走らせない。型・lint・テストだけなので
# 1回2分弱で、Actions の枠（月2,000分）への影響は小さい。
# フロントの実際の反映は今までどおり手動（deploy.yml）。
# **push での自動実行は止めてある。**
# 2026-08-21 に Actions の枠が 2,000/2,000（100%）に達したため。
# 枠がリセットされる（毎月1日）か、上限を引き上げるまでは手動実行のみ。
#
# 走らせたいときは Actions タブから "Checks" を Run workflow。
# ローカルでは `npx tsc --noEmit && npx eslint . && npx vitest run` が同じ内容
# （重いテスト `*.slow.test.ts` はどちらでも流れない。`npm run verify` でだけ流す）。
# **`GITHUB_TOKEN` に何も渡さない（IAM-3）。**
# どのワークフローも `actions/checkout` 以外でトークンを使っていないのに、
# 既定の権限（リポジトリ設定次第では contents: write まで）が渡っていた。
# checkout に要るのは読み取りだけ。**渡していない権限は漏らせない**。
permissions:
  contents: read

on:
  workflow_dispatch:
  # 枠が戻ったら、以下のコメントを外して push での自動実行に戻す。
  # push:
  #   branches:
  #     - develop
  #   paths:
  #     - "app/**"
  #     - "lib/**"
  #     - "scripts/**"
  #     - "public/**"
  #     - ".github/workflows/**"
  #     - "package.json"
  #     - "package-lock.json"
  #     - "tsconfig.json"
  #     - "vitest.config.ts"
  #     - "vitest.setup.ts"

# 同じブランチに連続で push したら、古い方は打ち切る（枠を無駄にしない）。
# デプロイと違って途中で止めても困らない検査なので cancel-in-progress: true。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 型・lint・テスト
    runs-on: ubuntu-latest
    # **`deploy.yml` と同じ理由で上げた。** 全スイートは CI で約9〜10分
    # （実測: Deploy Site の `Run tests` が 2026-09-12 に 8分59秒、
    # 2026-09-13 に 10分の上限で打ち切られた）。install・tsc・eslint を
    # 足すと 15分では足りない。上限の目的（ハングを止める）は 25分でも残る。
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx vitest run
