name: EXIF diagnose

# 一時診断: 本番の写真ページ/一覧に EXIF が実際に載っているか（配信HTML＋API）を確認する。
# 原因特定後に削除する。

on:
  push:
    branches:
      - claude/improve-site-stability-u85Vz
    paths:
      - ".github/workflows/safari-diagnose.yml"
  workflow_dispatch:

jobs:
  exif-diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: API — count photos with exif
        run: |
          echo "=== admin API /photos ==="
          curl -s --max-time 30 "https://ionr4ik01e.execute-api.ap-northeast-1.amazonaws.com/photos" -o api.json -w "HTTP %{http_code} size %{size_download}\n"
          node -e '
            const d=JSON.parse(require("fs").readFileSync("api.json","utf8"));
            const ps=Array.isArray(d)?d:(d.photos||d.items||[]);
            const withE=ps.filter(p=>p&&p.exif&&Object.keys(p.exif).length);
            console.log("photos:",ps.length,"withExif:",withE.length);
            for (const p of ps.slice(0,6)) console.log("  ",String(p.id).slice(0,8),"exif:",p.exif?Object.keys(p.exif).join(","):"NONE","src?",!!p.src);
            // pick one WITH exif and one WITHOUT for detail-page checks
            const yes=withE[0]&&withE[0].id, no=(ps.find(p=>!p.exif||!Object.keys(p.exif).length)||{}).id;
            require("fs").writeFileSync("ids.txt",(yes||"")+"\n"+(no||""));
          '
      - name: Detail pages — is exif baked into the live HTML?
        run: |
          YES=$(sed -n '1p' ids.txt); NO=$(sed -n '2p' ids.txt)
          for id in "$YES" "$NO"; do
            [ -z "$id" ] && continue
            echo "=== /photo/$id ==="
            curl -s --max-time 30 "https://journey-photo.com/photo/$id" -o d.html -w "HTTP %{http_code} size %{size_download}\n"
            echo -n "  has 'Camera Settings'/'撮影情報' label: "; grep -c -e "Camera Settings" -e "撮影情報" d.html || true
            echo -n "  has \"exif\" JSON in page data: "; grep -o '\\\"exif\\\"' d.html | head -1 || true
            echo -n "  has camera/aperture value: "; grep -o -e '\\\"camera\\\"' -e '\\\"aperture\\\"' d.html | sort -u | tr '\n' ' '; echo
          done
      - name: Home — does embedded/fetched data carry exif?
        run: |
          echo "=== home / ==="
          curl -s --max-time 30 "https://journey-photo.com/" -o h.html -w "HTTP %{http_code} size %{size_download}\n"
          echo -n "  occurrences of \"exif\" in home HTML: "; grep -o '\\\"exif\\\"' h.html | wc -l
