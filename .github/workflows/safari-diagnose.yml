name: EXIF backfill (manual)

# S3 のオリジナル画像から EXIF を再抽出して DynamoDB に書き戻す保守ジョブ。
# 既定は DRY-RUN。実書き込みは workflow_dispatch の apply=true で。
# 動作確認後に削除する。

on:
  push:
    branches:
      - claude/improve-site-stability-u85Vz
    paths:
      - "scripts/backfill-exif-from-s3.js"
      - ".github/workflows/safari-diagnose.yml"
  workflow_dispatch:
    inputs:
      apply:
        description: "true で DynamoDB に書き込む（false=dry-run）"
        type: boolean
        default: false

env:
  AWS_REGION: ap-northeast-1
  PHOTOS_TABLE: prod-photo-gallery-photos
  UPLOAD_BUCKET: prod-journey-photo-upload

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run backfill
        run: node scripts/backfill-exif-from-s3.js
        env:
          APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '' }}
