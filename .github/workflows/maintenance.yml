name: Maintenance

# 手動実行の保守作業。既定はドライランで、apply を true にしたときだけ変更する。
on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行する作業"
        type: choice
        options:
          - cdn-error-pages   # 存在しないURLを自作404へ
          - shrink-profiles   # 既存のプロフィール画像を縮小
          - enable-cdn-logs   # CloudFront のアクセスログを有効化
          - who-liked         # 自分の写真にいいねした人を特定
          - image-perf        # 写真表示の速さに効く材料が揃っているか測る
          - story-index       # ストーリー一覧用の GSI を足す（全件 Scan をやめる）
          - normalize-image-urls  # 保存済みの画像URLのホスト名を配信URLに揃える
        required: true
      apply:
        description: "true で実際に適用（false は内容の確認のみ）"
        type: boolean
        default: false
      owner_user_id:
        description: "who-liked のときの対象ユーザーID（必須）"
        type: string
        default: ""

# これらは本番専用の保守ワークフロー。スクリプト側の「既定で本番」を撤去したので、
# ここで環境を明示する（渡し忘れたらスクリプトが止まる）。
env:
  AWS_REGION: ap-northeast-1
  PHOTOS_TABLE: prod-photo-gallery-photos
  USERS_TABLE: prod-photo-gallery-users
  UPLOAD_BUCKET: prod-journey-photo-upload
  CLOUDFRONT_URL: https://d1s3dwwzgxf5ni.cloudfront.net
  SITE_URL: https://journey-photo.com
  LOG_BUCKET: prod-journey-photo-cdn-logs

# 変更系の作業を二重に走らせない。
# shrink-profiles --apply を同時に2本動かすと、同じ
# profiles/<uid> のキーを奪い合って、どちらの縮小結果が残るか決まらない。
# 他の変更系ワークフロー（generate-thumbnails / restrict-originals）には
# 既に入っている。
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: 存在しないURLを自作404へ
        if: inputs.task == 'cdn-error-pages'
        run: node scripts/fix-cdn-error-pages.js ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: 既存のプロフィール画像を縮小
        if: inputs.task == 'shrink-profiles'
        run: node scripts/shrink-profile-images.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 25
        env:
          # 書き換えた分をエッジから追い出す（アイコンは固定キーのため）
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: CloudFront のアクセスログを有効化
        if: inputs.task == 'enable-cdn-logs'
        run: node scripts/enable-cdn-logs.js ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      # 保存済みの画像URLのホスト名を揃える。
      # サムネ生成が CloudFront の既定ドメインを土台にしていた時期があり、
      # 同じサイトの画像が2つのホスト名で保存された（実測30件中11件）。
      # サイトマップが両方を <image:loc> に載せるので、画像のインデックスが
      # 2ホストに割れる。以後の書き込みは直したので、これは後片付け。
      # 既定はドライラン。値を見てから apply を判断できる。
      - name: 画像URLのホスト名を配信URLに揃える
        if: inputs.task == 'normalize-image-urls'
        run: node scripts/normalize-image-urls.js ${{ inputs.apply && '--apply' || '' }}
        env:
          # 揃える先。CLOUDFRONT_URL ではなく、実際に配信しているURL
          PUBLIC_BASE_URL: https://journey-photo.com
          OLD_HOSTS: d1s3dwwzgxf5ni.cloudfront.net

      # 読み取り専用。apply の指定は不要
      - name: 指定ユーザーの写真にいいねした人を特定
        if: inputs.task == 'who-liked'
        run: node scripts/who-liked.js
        env:
          # 未指定だとスクリプト側が中止する（全ユーザー分がログに出るのを防ぐため）
          OWNER_USER_ID: ${{ inputs.owner_user_id }}

      # ストーリー一覧が毎回テーブル全体を Scan していた問題の移行。
      # 同居するいいね/フォローのマーカーは退会しても消えないので増える一方で、
      # いずれ実行時間に収まらなくなり「全員のストーリー欄が同時に壊れる」。
      # 索引が ACTIVE になるまではコード側が Scan にフォールバックする。
      - name: ストーリー一覧用の索引を足す
        if: inputs.task == 'story-index'
        run: node scripts/add-story-index.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 15

      # 読み取り専用。apply の指定は不要
      - name: 写真表示の速さを測る
        if: inputs.task == 'image-perf'
        run: node scripts/diagnose-image-perf.js
        timeout-minutes: 10
