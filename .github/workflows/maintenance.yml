name: Maintenance

# 手動実行の保守作業。既定はドライランで、apply を true にしたときだけ変更する。
# **`GITHUB_TOKEN` に何も渡さない（IAM-3）。**
# どのワークフローも `actions/checkout` 以外でトークンを使っていないのに、
# 既定の権限（リポジトリ設定次第では contents: write まで）が渡っていた。
# checkout に要るのは読み取りだけ。**渡していない権限は漏らせない**。
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行する作業"
        type: choice
        options:
          - cdn-error-pages   # 存在しないURLを自作404へ
          - shrink-profiles   # 既存のプロフィール画像を縮小
          - enable-cdn-logs   # CloudFront のアクセスログを有効化
          - who-liked         # 自分の写真にいいねした人を特定
          - image-perf        # 写真表示の速さに効く材料が揃っているか測る
          - story-index       # ストーリー一覧用の GSI を足す（全件 Scan をやめる）
          - normalize-image-urls  # 保存済みの画像URLのホスト名を配信URLに揃える
          - geocode-locations # 地名はあるが座標が無い写真に、おおよその座標を補う（地図ページの材料）
          - diagnose          # 本番の設定を読むだけ（索引の射影・日付の形・Cognito・CDN の TTL）
          - orphan-uploads    # どの行からも参照されていないアップロード実体を探す
          - verify-upload     # **staging** で presign が本当に使えるか確かめる（apply が要る）
          - verify-invalidate # **staging** で削除時のエッジ掃除が Lambda の中で動くか確かめる（apply が要る）
        required: true
      apply:
        description: "true で実際に適用（false は内容の確認のみ）"
        type: boolean
        default: false
      owner_user_id:
        description: "who-liked のときの対象ユーザーID（必須）"
        type: string
        default: ""
      geocode_skip:
        description: "geocode-locations で飛ばす地名（カンマ区切り。ドライランで当て違いと分かったもの）"
        type: string
        default: ""

# これらは本番専用の保守ワークフロー。スクリプト側の「既定で本番」を撤去したので、
# ここで環境を明示する（渡し忘れたらスクリプトが止まる）。
env:
  AWS_REGION: ap-northeast-1
  PHOTOS_TABLE: prod-photo-gallery-photos
  USERS_TABLE: prod-photo-gallery-users
  UPLOAD_BUCKET: prod-journey-photo-upload
  CLOUDFRONT_URL: https://d1s3dwwzgxf5ni.cloudfront.net
  SITE_URL: https://journey-photo.com
  LOG_BUCKET: prod-journey-photo-cdn-logs

# 変更系の作業を二重に走らせない。
# shrink-profiles --apply を同時に2本動かすと、同じ
# profiles/<uid> のキーを奪い合って、どちらの縮小結果が残るか決まらない。
# 他の変更系ワークフロー（generate-thumbnails / restrict-originals）には
# 既に入っている。
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: 存在しないURLを自作404へ
        if: inputs.task == 'cdn-error-pages'
        run: node scripts/fix-cdn-error-pages.js ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: 既存のプロフィール画像を縮小
        if: inputs.task == 'shrink-profiles'
        run: node scripts/shrink-profile-images.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 25
        env:
          # 書き換えた分をエッジから追い出す（アイコンは固定キーのため）
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: CloudFront のアクセスログを有効化
        if: inputs.task == 'enable-cdn-logs'
        run: node scripts/enable-cdn-logs.js ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      # 保存済みの画像URLのホスト名を揃える。
      # サムネ生成が CloudFront の既定ドメインを土台にしていた時期があり、
      # 同じサイトの画像が2つのホスト名で保存された（実測30件中11件）。
      # サイトマップが両方を <image:loc> に載せるので、画像のインデックスが
      # 2ホストに割れる。以後の書き込みは直したので、これは後片付け。
      # 既定はドライラン。値を見てから apply を判断できる。
      - name: 画像URLのホスト名を配信URLに揃える
        if: inputs.task == 'normalize-image-urls'
        run: node scripts/normalize-image-urls.js ${{ inputs.apply && '--apply' || '' }}
        env:
          # 揃える先。CLOUDFRONT_URL ではなく、実際に配信しているURL
          PUBLIC_BASE_URL: https://journey-photo.com
          OLD_HOSTS: d1s3dwwzgxf5ni.cloudfront.net

      # 読み取り専用。apply の指定は不要
      - name: 指定ユーザーの写真にいいねした人を特定
        if: inputs.task == 'who-liked'
        run: node scripts/who-liked.js
        env:
          # 未指定だとスクリプト側が中止する（全ユーザー分がログに出るのを防ぐため）
          OWNER_USER_ID: ${{ inputs.owner_user_id }}

      # ストーリー一覧が毎回テーブル全体を Scan していた問題の移行。
      # 同居するいいね/フォローのマーカーは退会しても消えないので増える一方で、
      # いずれ実行時間に収まらなくなり「全員のストーリー欄が同時に壊れる」。
      # 索引が ACTIVE になるまではコード側が Scan にフォールバックする。
      - name: ストーリー一覧用の索引を足す
        if: inputs.task == 'story-index'
        run: node scripts/add-story-index.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 15

      # 読み取り専用。apply の指定は不要
      - name: 写真表示の速さを測る
        if: inputs.task == 'image-perf'
        run: node scripts/diagnose-image-perf.js
        timeout-minutes: 10

      # **読み取りだけ。** 作業環境からは AWS を叩けない（資格情報が
      # プレースホルダ）ので、台帳に「要 AWS」で溜まっていた確認を
      # 資格情報のある CI から1回で済ませる。Describe / Scan(COUNT) / Get のみ。
      # **既定はドライラン。** `--apply` のときだけ消す。
      # 新しいもの（既定7日以内）は触らない——「保存に失敗した」と
      # 「まだ保存していない」は S3 からは区別できないので、時間で分ける。
      - name: 参照されていないアップロード実体を探す
        if: inputs.task == 'orphan-uploads'
        run: node scripts/find-orphan-uploads.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 15

      # **staging に対してだけ**走る（スクリプト側もバケット名で拒否する）。
      # 本番の値がジョブ全体の env に入っているので、ここで上書きする。
      # 上書きを忘れると本番のバケットに書きに行くので、二重に止める。
      - name: presign が本当に使えるか確かめる（staging）
        if: inputs.task == 'verify-upload'
        run: npx tsx scripts/verify-upload.ts ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 5
        env:
          UPLOAD_BUCKET: staging-journey-photo-upload
          PHOTOS_TABLE: staging-photo-gallery-photos
          USERS_TABLE: staging-photo-gallery-users
          CLOUDFRONT_URL: https://d15fn3rcaiymu9.cloudfront.net
          # 実在しない利用者として叩く（枚数の上限判定が 0 件になる）。
          # 固定値にするのは、残骸が出たときに誰のものか分かるようにするため
          VERIFY_USER_ID: verify-upload-00000000-0000-4000-8000-000000000000

      - name: エッジの掃除が Lambda の中で動くか確かめる（staging）
        if: inputs.task == 'verify-invalidate'
        run: npx tsx scripts/verify-invalidate.ts ${{ inputs.apply && '--apply' || '' }}
        # **10分にする。** `cleanupStories` の Lambda タイムアウトは 300秒＝
        # ちょうど5分で、Invoke は同期。前半だけで枠を使い切ると GitHub が
        # プロセスを殺すので `finally` が走らず、staging にダミーが残る
        # ——その残骸は期限切れストーリーなので、次の毎時実行が掃除して
        # `del-…` を作る＝**次回の偽陽性の種**になる（レビュー指摘）
        timeout-minutes: 10
        env:
          # **staging を明示する。** 上の env は本番向けなので、上書きしないと
          # 本番のテーブルにダミーの行を書きに行く（スクリプト側も staging-
          # で始まらなければ止めるが、守りは2枚にしておく）
          UPLOAD_BUCKET: staging-journey-photo-upload
          PHOTOS_TABLE: staging-photo-gallery-photos
          CLOUDFRONT_DISTRIBUTION_ID: EF2TFEBBP24DL
          CLEANUP_FUNCTION: photo-gallery-user-api-staging-cleanupStories
          # 管理API側（別サービス＝別の IAM・別の環境変数）も同じやり方で確かめる
          ADMIN_DELETE_FUNCTION: photo-gallery-api-staging-deletePhoto

      - name: 地名から おおよその座標を補う
        if: inputs.task == 'geocode-locations'
        # Nominatim は 1リクエスト/秒。地名が数十種でも数十秒で終わる
        run: node scripts/geocode-locations.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 10
        env:
          GEOCODE_SKIP: ${{ inputs.geocode_skip }}

      - name: 本番の設定を読む（診断）
        if: inputs.task == 'diagnose'
        run: node scripts/diagnose-aws.js
        timeout-minutes: 10
        env:
          COGNITO_USER_POOL_ID: ap-northeast-1_ZbuhDQsWz
          COGNITO_CLIENT_ID: 21cs4cd8dkttmg3snloj72u8mu
          CLOUDFRONT_DISTRIBUTION_ID: EYRLTGCPOS9E4
