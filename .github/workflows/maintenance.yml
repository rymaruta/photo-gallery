name: Maintenance

# 手動実行の保守作業。既定はドライランで、apply を true にしたときだけ変更する。
# **`GITHUB_TOKEN` に何も渡さない（IAM-3）。**
# どのワークフローも `actions/checkout` 以外でトークンを使っていないのに、
# 既定の権限（リポジトリ設定次第では contents: write まで）が渡っていた。
# checkout に要るのは読み取りだけ。**渡していない権限は漏らせない**。
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行する作業"
        type: choice
        options:
          - cdn-error-pages   # 存在しないURLを自作404へ
          - shrink-profiles   # 既存のプロフィール画像を縮小
          - enable-cdn-logs   # CloudFront のアクセスログを有効化
          - who-liked         # 自分の写真にいいねした人を特定
          - image-perf        # 写真表示の速さに効く材料が揃っているか測る
          - story-index       # ストーリー一覧用の GSI を足す（全件 Scan をやめる）
          - public-feed-index # 公開一覧用の GSI を足す（GET /photos の全件 Scan をやめる）
          - backfill-followers # 既にあるフォロー関係から followers#<uid> を作る
          - repair-follow-graph # フォローの4種類の行を突き合わせ、食い違いを直す（既定は読むだけ）
          - normalize-image-urls  # 保存済みの画像URLのホスト名を配信URLに揃える
          - geocode-locations # 地名はあるが座標が無い写真に、おおよその座標を補う（地図ページの材料）
          - diagnose          # 本番の設定を読むだけ（索引の射影・日付の形・Cognito・CDN の TTL）
          - repair-user-groups # 登録済みなのに user グループに入っていない人を入れ直す（既定は読むだけ・apply で実行）
          - attach-post-confirmation # プールに PostConfirmation トリガーと呼び出し許可を ID 指名で付け直す（既定は読むだけ・apply で実行）
          - purge-unconfirmed-users # 確認が終わっていない（UNCONFIRMED）利用者を消す（既定は読むだけ・apply で実行）
          - unused-resources   # AWS に在るものと、このリポジトリが使っているものを突き合わせる（読み取りのみ・消さない）
          - purge-leftover-resources # 消した環境の残骸を消す（一覧に名前を書いたものだけ・既定は読むだけ・apply で実行）
          - content-opportunities # どこを直すと「検索に出せるページ」が増えるかを数える（読み取りのみ）
          - orphan-uploads    # どの行からも参照されていないアップロード実体を探す
          - verify-upload     # **staging** で presign が本当に使えるか確かめる（apply が要る）
          - verify-invalidate # **staging** で削除時のエッジ掃除が Lambda の中で動くか確かめる（apply が要る）
          - verify-origin-failover # **staging** でオリジングループが 404ページより先に効くか確かめる（動的化の関門）
        required: true
      apply:
        description: "true で実際に適用（false は内容の確認のみ）"
        type: boolean
        default: false
      owner_user_id:
        description: "who-liked のときの対象ユーザーID（必須）"
        type: string
        default: ""
      geocode_skip:
        description: "geocode-locations で飛ばす地名（セミコロン ; 区切り。地名にカンマが入るため。ドライランで当て違いと分かったもの）"
        type: string
        default: ""
      purge_older_than_days:
        description: "purge-unconfirmed-users で「これより古いものだけ消す」日数。既定7。**0 にすると たった今 登録した人も対象になる**"
        type: string
        default: "7"

# これらは本番専用の保守ワークフロー。スクリプト側の「既定で本番」を撤去したので、
# ここで環境を明示する（渡し忘れたらスクリプトが止まる）。
env:
  AWS_REGION: ap-northeast-1
  PHOTOS_TABLE: prod-photo-gallery-photos
  USERS_TABLE: prod-photo-gallery-users
  UPLOAD_BUCKET: prod-journey-photo-upload
  CLOUDFRONT_URL: https://d1s3dwwzgxf5ni.cloudfront.net
  SITE_URL: https://journey-photo.com
  LOG_BUCKET: prod-journey-photo-cdn-logs

# 変更系の作業を二重に走らせない。
# shrink-profiles --apply を同時に2本動かすと、同じ
# profiles/<uid> のキーを奪い合って、どちらの縮小結果が残るか決まらない。
# 他の変更系ワークフロー（generate-thumbnails / restrict-originals）には
# 既に入っている。
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: 存在しないURLを自作404へ
        if: inputs.task == 'cdn-error-pages'
        run: node scripts/fix-cdn-error-pages.js ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: 既存のプロフィール画像を縮小
        if: inputs.task == 'shrink-profiles'
        run: node scripts/shrink-profile-images.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 25
        env:
          # 書き換えた分をエッジから追い出す（アイコンは固定キーのため）
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      - name: CloudFront のアクセスログを有効化
        if: inputs.task == 'enable-cdn-logs'
        run: node scripts/enable-cdn-logs.js ${{ inputs.apply && '--apply' || '' }}
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

      # 保存済みの画像URLのホスト名を揃える。
      # サムネ生成が CloudFront の既定ドメインを土台にしていた時期があり、
      # 同じサイトの画像が2つのホスト名で保存された（実測30件中11件）。
      # サイトマップが両方を <image:loc> に載せるので、画像のインデックスが
      # 2ホストに割れる。以後の書き込みは直したので、これは後片付け。
      # 既定はドライラン。値を見てから apply を判断できる。
      - name: 画像URLのホスト名を配信URLに揃える
        if: inputs.task == 'normalize-image-urls'
        run: node scripts/normalize-image-urls.js ${{ inputs.apply && '--apply' || '' }}
        env:
          # 揃える先。CLOUDFRONT_URL ではなく、実際に配信しているURL
          PUBLIC_BASE_URL: https://journey-photo.com
          OLD_HOSTS: d1s3dwwzgxf5ni.cloudfront.net

      # 読み取り専用。apply の指定は不要
      - name: 指定ユーザーの写真にいいねした人を特定
        if: inputs.task == 'who-liked'
        run: node scripts/who-liked.js
        env:
          # 未指定だとスクリプト側が中止する（全ユーザー分がログに出るのを防ぐため）
          OWNER_USER_ID: ${{ inputs.owner_user_id }}

      # ストーリー一覧が毎回テーブル全体を Scan していた問題の移行。
      # 同居するいいね/フォローのマーカーは退会しても消えないので増える一方で、
      # いずれ実行時間に収まらなくなり「全員のストーリー欄が同時に壊れる」。
      # 索引が ACTIVE になるまではコード側が Scan にフォールバックする。
      - name: ストーリー一覧用の索引を足す
        if: inputs.task == 'story-index'
        run: node scripts/add-story-index.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 15

      # 公開一覧（GET /photos）の全件 Scan をやめるための索引。
      # **必ずドライランを先に流すこと**——`createdAt` を持たない公開写真が
      # あると、読む側を Query に切り替えた瞬間にその写真が一覧から消える
      # （GSI はキーが揃った項目しか載せない）。件数はドライランで報告する。
      # 索引の作成は完了を待たない。ACTIVE になるまでもう一度流すと状態が出る。
      - name: 公開一覧用の索引を足す
        if: inputs.task == 'public-feed-index'
        run: node scripts/add-public-feed-index.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 15

      # `followers#<uid>`（誰にフォローされているか）は、これまで持って
      # いなかった行。`follow.ts` は今後のフォローにしか書かないので、
      # **既にある関係はここで埋める**（解除→再フォローしない限り入らない）。
      # 併合するので何度流しても安全。ドライランで人数が出る。
      - name: フォロワー一覧を埋め戻す
        if: inputs.task == 'backfill-followers'
        run: node scripts/backfill-followers.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 15

      # フォローは4種類の行（マーカー・数・フォロー中の並び・フォロワーの並び）に
      # 分かれていて、1回の書き込みで揃うのはマーカーと数だけ。**ずれる形が
      # 最初から入っている**。さらに `isUserId` を入れる前の壊れた ID の
      # マーカーが本番に実在し（2026-09-13 実測で2件）、読む側は弾けても
      # **数は弾けない**——「フォロー中 2」なのに一覧は空、という
      # 誰にも直せない状態になる。マーカーを正として数え直す。
      # **ドライラン（既定）は1行も書かない**ので、実態の確認にそのまま使える。
      - name: フォローの行の食い違いを直す
        if: inputs.task == 'repair-follow-graph'
        run: node scripts/repair-follow-graph.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 15

      # 読み取り専用。apply の指定は不要
      - name: 写真表示の速さを測る
        if: inputs.task == 'image-perf'
        run: node scripts/diagnose-image-perf.js
        timeout-minutes: 10

      # **読み取りだけ。** 作業環境からは AWS を叩けない（資格情報が
      # プレースホルダ）ので、台帳に「要 AWS」で溜まっていた確認を
      # 資格情報のある CI から1回で済ませる。Describe / Scan(COUNT) / Get のみ。
      # **既定はドライラン。** `--apply` のときだけ消す。
      # 新しいもの（既定7日以内）は触らない——「保存に失敗した」と
      # 「まだ保存していない」は S3 からは区別できないので、時間で分ける。
      - name: 参照されていないアップロード実体を探す
        if: inputs.task == 'orphan-uploads'
        run: node scripts/find-orphan-uploads.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 15

      # **staging に対してだけ**走る（スクリプト側もバケット名で拒否する）。
      # 本番の値がジョブ全体の env に入っているので、ここで上書きする。
      # 上書きを忘れると本番のバケットに書きに行くので、二重に止める。
      - name: presign が本当に使えるか確かめる（staging）
        if: inputs.task == 'verify-upload'
        run: npx tsx scripts/verify-upload.ts ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 5
        env:
          UPLOAD_BUCKET: staging-journey-photo-upload
          PHOTOS_TABLE: staging-photo-gallery-photos
          USERS_TABLE: staging-photo-gallery-users
          CLOUDFRONT_URL: https://d15fn3rcaiymu9.cloudfront.net
          # 実在しない利用者として叩く（枚数の上限判定が 0 件になる）。
          # 固定値にするのは、残骸が出たときに誰のものか分かるようにするため
          VERIFY_USER_ID: verify-upload-00000000-0000-4000-8000-000000000000

      - name: エッジの掃除が Lambda の中で動くか確かめる（staging）
        if: inputs.task == 'verify-invalidate'
        run: npx tsx scripts/verify-invalidate.ts ${{ inputs.apply && '--apply' || '' }}
        # **10分にする。** `cleanupStories` の Lambda タイムアウトは 300秒＝
        # ちょうど5分で、Invoke は同期。前半だけで枠を使い切ると GitHub が
        # プロセスを殺すので `finally` が走らず、staging にダミーが残る
        # ——その残骸は期限切れストーリーなので、次の毎時実行が掃除して
        # `del-…` を作る＝**次回の偽陽性の種**になる（レビュー指摘）
        timeout-minutes: 10
        env:
          # **staging を明示する。** 上の env は本番向けなので、上書きしないと
          # 本番のテーブルにダミーの行を書きに行く（スクリプト側も staging-
          # で始まらなければ止めるが、守りは2枚にしておく）
          UPLOAD_BUCKET: staging-journey-photo-upload
          PHOTOS_TABLE: staging-photo-gallery-photos
          CLOUDFRONT_DISTRIBUTION_ID: EF2TFEBBP24DL
          CLEANUP_FUNCTION: photo-gallery-user-api-staging-cleanupStories
          # 管理API側（別サービス＝別の IAM・別の環境変数）も同じやり方で確かめる
          ADMIN_DELETE_FUNCTION: photo-gallery-api-staging-deletePhoto

      - name: オリジングループが 404ページより先に効くか確かめる（staging）
        if: inputs.task == 'verify-origin-failover'
        # **動的化（②）の関門。** 案 (c) は「S3 が 403/404 を返したら Lambda へ回す」
        # 形だが、`fix-cdn-error-pages.js` の **カスタムエラー応答は
        # ディストリビューション全体に効く**ので、そのままだと必ず 404.html に
        # 化ける。オリジングループのフェイルオーバーが**その手前**で効くかどうかで
        # 設計が決まる（`docs/dynamic-photo-page-2026-09.md` が
        # 「実機で1回確かめてから」と書いて止まっていた所）。
        #
        # 配信の更新が2回（足す・戻す）入り、そのたびに数分待つ
        timeout-minutes: 30
        run: node scripts/verify-origin-failover.js ${{ inputs.apply && '--apply' || '' }}
        env:
          # **staging を明示する。** 上の env は本番向け。スクリプト側も
          # 本番の配信ID・関数名・バケット名を見たら止めるが、守りは2枚にする
          CLOUDFRONT_DISTRIBUTION_ID: EF2TFEBBP24DL
          SITE_BUCKET: staging-journey-photo.com

      - name: 地名から おおよその座標を補う
        if: inputs.task == 'geocode-locations'
        # Nominatim は 1リクエスト/秒。地名が数十種でも数十秒で終わる
        run: node scripts/geocode-locations.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 10
        env:
          GEOCODE_SKIP: ${{ inputs.geocode_skip }}

      # **読み取りだけ（Scan のみ）。** apply の指定は要らない。
      # 検索での面積はサイトマップの件数そのもので、写真を増やす以外に
      # 増やす道は集約ページを線の上に押し上げること。いちばん効くのは
      # 「あと1枚」——1枚の写真にタグや撮影地を足すだけでページが丸ごと
      # 検索に出せるようになる。**手で数えない**（撮影地は緩い一致で
      # 束ねるので、完全一致で数えると結論を誤る）
      - name: どこを直すと検索の面積が増えるか
        if: inputs.task == 'content-opportunities'
        run: npx tsx scripts/content-opportunities.ts
        timeout-minutes: 10

      - name: 本番の設定を読む（診断）
        if: inputs.task == 'diagnose'
        run: node scripts/diagnose-aws.js
        timeout-minutes: 10
        env:
          COGNITO_USER_POOL_ID: ap-northeast-1_ZbuhDQsWz
          COGNITO_CLIENT_ID: 21cs4cd8dkttmg3snloj72u8mu
          CLOUDFRONT_DISTRIBUTION_ID: EYRLTGCPOS9E4

      # 新規登録した人が投稿できない、の復旧。PostConfirmation トリガーは失敗を
      # 握るので、`user` グループが無かった期間に登録した人はログインできるのに
      # 投稿だけ開けない。トリガーはもう発火しないので、ここで入れ直す。
      # 入れたあと、本人は一度ログインし直す必要がある。
      - name: user グループに入っていない人を入れ直す
        if: inputs.task == 'repair-user-groups'
        run: node scripts/repair-user-groups.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 10
        env:
          COGNITO_USER_POOL_ID: ap-northeast-1_ZbuhDQsWz

      # 本番の diagnose（2026-09-16）で「プールに PostConfirmation トリガーが
      # 付いていない」と出た。api の再デプロイでは付き直らない——付けるのは
      # CloudFormation のカスタムリソースで、プロパティが変わらないと走らないうえ、
      # プールを**名前**で探す。ここは ID を指名して、トリガーと Cognito からの
      # 呼び出し許可の両方を揃える。トリガー以外の設定は1つも変えない。
      - name: PostConfirmation トリガーを付け直す
        if: inputs.task == 'attach-post-confirmation'
        run: node scripts/attach-post-confirmation.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 10
        env:
          COGNITO_USER_POOL_ID: ap-northeast-1_ZbuhDQsWz
          STAGE: prod

      # 登録の途中で離脱した人（UNCONFIRMED）を消す。**取り消せない**ので
      # 既定は読むだけ。消すのは UNCONFIRMED だけで、`FORCE_CHANGE_PASSWORD`
      # （管理者が作ったばかりの正規の利用者）には触らない。新しすぎる人
      # （既定7日未満）も触らない——確認コードの寿命は24時間なので、
      # いま登録してコードを打とうとしている人を壊さないため。
      - name: 確認が終わっていない利用者を消す
        if: inputs.task == 'purge-unconfirmed-users'
        run: node scripts/purge-unconfirmed-users.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 10
        env:
          COGNITO_USER_POOL_ID: ap-northeast-1_ZbuhDQsWz
          PURGE_OLDER_THAN_DAYS: ${{ inputs.purge_older_than_days }}

      # 費用の当たりを付けるための棚卸し。**読むだけで、1つも消さない。**
      # `apply` は受け取らない——このリポジトリから「不要」と言い切れるものは
      # 少なく（コンソールで手で作った依存はコードに現れない）、消す判断は人がする。
      - name: AWS に在るものを棚卸しする（読み取りのみ）
        if: inputs.task == 'unused-resources'
        run: node scripts/unused-resources.js
        timeout-minutes: 10

      # 消した環境の残骸を消す。**取り消せない**ので既定は読むだけ。
      # **パターンでは消さない**——スクリプトの中の一覧に名前を書いたものだけ。
      # さらに一覧に書いてあっても、prod-/staging- で始まるもの・serverless の
      # デプロイ用バケット・Lambda@Edge の OGP 関数は消さない（一覧を書く側が
      # 間違えても止まるように）。消す直前に CloudFront が使っていないかも聞く。
      - name: 消した環境の残骸を消す
        if: inputs.task == 'purge-leftover-resources'
        run: node scripts/purge-leftover-resources.js ${{ inputs.apply && '--apply' || '' }}
        timeout-minutes: 20
