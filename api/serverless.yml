service: photo-gallery-api

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1

  # 環境ごとの値。既定値は置かない——未指定ならデプロイを失敗させる。
  # 以前はテーブル名がリテラルの prod-... で、--stage を変えても
  # 読み書き先が本番のままだった（ステージングを作ると本番を壊す状態）。
  environment:
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}
    # 退会・写真削除・非公開のあとに静的サイトの再ビルドを頼むための設定。
    # 未設定なら「頼まない」だけで、削除そのものは成功する（警告を1行出す）。
    # 設定しないと、消した写真のページが次に誰かが push するまで公開のまま残る。
    REBUILD_REPO: ${param:rebuildRepo, ''}
    REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
    # 1か月に頼んでよい再ビルドの本数（既定 200）。Actions の枠を上げたときに
    # 合わせる。**Lambda コンソールで直接いじっても次のデプロイで消える**ので、
    # ここか deploy-api.yml のリポジトリ変数から渡すこと。
    # 空文字・数値でない値は既定に落ちる（api-user/src/rebuild.ts）。
    REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    UPLOAD_BUCKET: ${param:uploadBucket}
    CLOUDFRONT_URL: ${param:cloudfrontUrl}

  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${param:cognitoUserPoolId}
        audience:
          - ${param:cognitoClientId}

  iam:
    role:
      statements:
        # 写真データ DynamoDB CRUD
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
        # 登録完了時にプロフィール行を作る（PostConfirmation トリガー）
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
        # アップロード画像の管理（Presigned URL 発行・削除）。
        # uploads/ 配下に限る。バケット全体を許すと profiles/*（他人のアイコン）
        # まで届き、ハンドラ側の uploads/ チェック1か所が唯一の防波堤になる。
        # api-user 側は最初からこの粒度で切ってある。
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${param:uploadBucket}/uploads/*
        # PostConfirmation トリガー: 確認済みユーザーを user グループへ追加
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
          Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  getPhotos:
    handler: src/photos.getPhotos
    events:
      - httpApi:
          path: /photos
          method: GET

  getPhoto:
    handler: src/photos.getPhoto
    events:
      - httpApi:
          path: /photos/{id}
          method: GET

  # 管理画面用。下書きも返すので必ず認証を要求する（ハンドラ側でも admin を確認）
  getPhotosForAdmin:
    handler: src/photos.getPhotosForAdmin
    events:
      - httpApi:
          path: /admin/photos
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updatePhoto:
    handler: src/photosMutate.updatePhoto
    events:
      - httpApi:
          path: /photos/{id}
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  deletePhoto:
    # 実体を消したあとに静的サイトの再ビルドを頼む（外部への HTTP）。
    # 既定の6秒だと、GitHub が遅いだけで**データはもう消えているのに
    # 500 が返る**（押し直すと今度は 404）。Lambda は実際に使った時間
    # だけ課金されるので、広げても普段の費用は変わらない。
    timeout: 15
    handler: src/photosMutate.deletePhoto
    events:
      - httpApi:
          path: /photos/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  presignedUrl:
    handler: src/upload.presignedUrl
    events:
      - httpApi:
          path: /upload/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  savePhoto:
    handler: src/upload.savePhoto
    events:
      - httpApi:
          path: /upload/save
          method: POST
          authorizer:
            name: cognitoAuthorizer

  postConfirmation:
    handler: src/cognitoTrigger.postConfirmation
    events:
      # ⚠️ existing: true は「既にあるプールを書き換える」。プール名を間違えると
      # 別環境のプールのトリガーを奪う（本番の新規登録が壊れる）。既定値は置かない。
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: PostConfirmation
          existing: true
