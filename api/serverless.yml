service: photo-gallery-api

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1
  # **ログの保存期間は 90 日**（2026-10-18・owner の委任）。指定が無いと CloudWatch Logs は
  # **無期限**に残す。ログには利用者 ID（Cognito の sub）が入るので、期限なしで溜めない。
  # 効くのは **serverless が作る分は全部**（関数ごとのロググループ。HTTP API のアクセスログを
  # 有効にした場合もこの値）。serverless は関数ごとのロググループを前から CloudFormation の
  # 部品として作っているので、既存の部品に `RetentionInDays` を足すだけ（部品の数は増えない＝
  # 上限 500 に響かない）。
  # ⚠️ **Lambda@Edge（OGP の書き換え）のログは対象外。** CloudFormation の外で作られた関数で、
  # ログは各地域の `/aws/lambda/us-east-1.<関数名>` に**無期限のまま**残る。
  # その期限は owner が別に付ける必要がある（ここからは付けられない）。
  # 費用は下がる方向だけ: 保存（GB・月）が 90 日で頭打ちになる。取り込み・期限切れの削除は
  # 今と同じ／無料。api と api-user で同じ値にそろえる（`scripts/__tests__/logRetention.test.ts`）
  logRetentionInDays: 90

  # 環境ごとの値。既定値は置かない——未指定ならデプロイを失敗させる。
  # 以前はテーブル名がリテラルの prod-... で、--stage を変えても
  # 読み書き先が本番のままだった（ステージングを作ると本番を壊す状態）。
  environment:
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}
    # 再ビルド依頼の設定（REBUILD_*）はここには置かない。**GitHub の書き込み
    # トークンなので、provider に置くと全関数の環境変数に入る**（IAM-2）。
    # 実際に頼むのは api-user で3つ・api で2つだけなので、その関数にだけ配る。
    # 環境変数は `lambda:GetFunctionConfiguration`（読み取り権）で誰でも読めて、
    # そこからリポジトリへの書き込み → デプロイ鍵、と輪が閉じる。
    # 未認証で呼べる口にまで配る理由は無い。
    UPLOAD_BUCKET: ${param:uploadBucket}
    CLOUDFRONT_URL: ${param:cloudfrontUrl}
    # 管理者削除でエッジの掃除に使う（LEFT-4）。**秘密ではない**ので
    # provider に置く（配信IDは CLAUDE.md にも書いてある。IAM-2 が
    # 関数ごとに配れと言っているのは GitHub の書き込みトークンの話）。
    # api-user 側と同じ形。未設定なら `invalidateUploads` が警告1行で
    # 飛ばす——設定漏れで削除そのものを止めない
    CLOUDFRONT_DISTRIBUTION_ID: ${param:cloudfrontDistributionId, ''}

  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${param:cognitoUserPoolId}
        audience:
          - ${param:cognitoClientId}

  iam:
    role:
      statements:
        # 写真データ DynamoDB CRUD
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
        # 登録完了時にプロフィール行を作る（PostConfirmation トリガー）
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
        # アップロード画像の管理（Presigned URL 発行・削除）。
        # uploads/ 配下に限る。バケット全体を許すと profiles/*（他人のアイコン）
        # まで届き、ハンドラ側の uploads/ チェック1か所が唯一の防波堤になる。
        # api-user 側は最初からこの粒度で切ってある。
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${param:uploadBucket}/uploads/*
        # 公開範囲を絞った写真の置き場（api-user の `privateMove.ts` が移す）。
        # 管理者の削除で消せないと、実体だけが残る。**消すだけ**（書かない）
        - Effect: Allow
          Action:
            - s3:DeleteObject
          Resource: arn:aws:s3:::${param:uploadBucket}/private/*
        # 管理者削除で消した実体を、エッジからも消す（LEFT-4）。
        # アップロードは max-age=31536000（1年）で配っていて、`/uploads/*` の
        # maxTTL も 31536000（本番実測 2026-09-05）。S3 から消すだけでは
        # **URL を知っていれば最大1年 取れ続ける**（GPS 入りの原本も同じ）。
        # api-user 側は前から持っていて、こちらだけ無かった。
        # 対象はこのアカウントの配信のみ。作成しかできない（読み書きは無い）。
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
          Resource:
            - arn:aws:cloudfront::${aws:accountId}:distribution/*
        # PostConfirmation トリガー: 確認済みユーザーを user グループへ追加
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
            # グループが無ければ作る（無いと新規登録した人が全員、投稿を開けない）
            - cognito-idp:CreateGroup
          Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  getPhotos:
    handler: src/photos.getPhotos
    # 未認証で呼べる口。既定の共有ロール（削除・Cognito つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /photos
          method: GET

  getPhoto:
    handler: src/photos.getPhoto
    # 未認証で呼べる口。既定の共有ロール（削除・Cognito つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /photos/{id}
          method: GET

  # 管理画面用。下書きも返すので必ず認証を要求する（ハンドラ側でも admin を確認）
  getPhotosForAdmin:
    handler: src/photos.getPhotosForAdmin
    events:
      - httpApi:
          path: /admin/photos
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updatePhoto:
    # ここも再ビルドを頼む（api/src/photosMutate.ts の updatePhoto）。
    # 既定の6秒のままだと、GitHub が黙っているときに**編集は保存済みなのに
    # 500 が返る**。しかも殺されると印と予算の解放に到達しない。
    timeout: 15
    handler: src/photosMutate.updatePhoto
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /photos/{id}
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  deletePhoto:
    # 実体を消したあとに静的サイトの再ビルドを頼む（外部への HTTP）。
    # 既定の6秒だと、GitHub が遅いだけで**データはもう消えているのに
    # 500 が返る**（押し直すと今度は 404）。Lambda は実際に使った時間
    # だけ課金されるので、広げても普段の費用は変わらない。
    timeout: 15
    handler: src/photosMutate.deletePhoto
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /photos/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  presignedUrl:
    handler: src/upload.presignedUrl
    events:
      - httpApi:
          path: /upload/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  savePhoto:
    handler: src/upload.savePhoto
    events:
      - httpApi:
          path: /upload/save
          method: POST
          authorizer:
            name: cognitoAuthorizer

  postConfirmation:
    handler: src/cognitoTrigger.postConfirmation
    events:
      # ⚠️ existing: true は「既にあるプールを書き換える」。プール名を間違えると
      # 別環境のプールのトリガーを奪う（本番の新規登録が壊れる）。既定値は置かない。
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: PostConfirmation
          existing: true

  # ─── Apple でサインイン（2026-10-21・`src/appleSignIn.ts` / `src/appleChallenge.ts`）───
  # アプリがネイティブで受け取った Apple の ID トークンを確かめ、Cognito のカスタム認証で入れる。
  # **Apple の公開鍵だけで確かめる**（秘密は持たない。取り消しの鍵は api-user の `revokeAppleSignIn`）。
  # **止めた状態を明示で持つ**: `appleSignInEnabled` が true でなければ止まる（既定は off）。
  # `appleBundleIds` が空でも止まる（入口は 503・Verify は通さない）。既定値は置かない

  # 入口（未認証）。探す・既存のメールのアカウントにつなぐ・作る。トークンは出さない
  appleSignIn:
    handler: src/appleSignIn.appleSignIn
    role: AppleSignInRole
    environment:
      COGNITO_USER_POOL_ID: ${param:cognitoUserPoolId}
      APPLE_BUNDLE_IDS: ${param:appleBundleIds, ''}
      APPLE_SIGNIN_ENABLED: ${param:appleSignInEnabled, 'false'}
    # Apple の公開鍵（打ち切り3秒）＋ Cognito の数回
    timeout: 15
    # **呼ばれすぎの守り**（未認証の口・2026-10-21）。同時に走るのは5本まで（超えた分は 429）。
    # ログインの瞬間だけ呼ばれる口なので、この規模では足りる。⚠️ アカウントの同時実行の上限が小さい
    # （新しいアカウントの10）と、予約でデプロイが断られる——そのときはこの行を外す
    reservedConcurrency: 5
    events:
      - httpApi:
          path: /auth/apple
          method: POST

  # カスタム認証のトリガー3本。**`custom:apple_sub` を持たない利用者は Define が断る**
  # （パスワードの人をこの道で開けない）。付け損ねたら
  # `TRIGGER=DefineAuthChallenge node scripts/attach-post-confirmation.js` で付け直す
  defineAuthChallenge:
    handler: src/appleChallenge.defineAuthChallenge
    role: CognitoChallengeRole
    events:
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: DefineAuthChallenge
          existing: true

  createAuthChallenge:
    handler: src/appleChallenge.createAuthChallenge
    role: CognitoChallengeRole
    events:
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: CreateAuthChallenge
          existing: true

  verifyAuthChallengeResponse:
    handler: src/appleChallenge.verifyAuthChallengeResponse
    role: CognitoChallengeRole
    environment:
      APPLE_BUNDLE_IDS: ${param:appleBundleIds, ''}
      APPLE_SIGNIN_ENABLED: ${param:appleSignInEnabled, 'false'}
    # Cognito のトリガーの上限は5秒。Apple の公開鍵は控えに当たればすぐ
    timeout: 5
    events:
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: VerifyAuthChallengeResponse
          existing: true

# ---------------------------------------------------------------------------
# 未認証で呼べる2つの口だけ、専用の最小ロールに分ける（IAM-1。api-user 側と対）
#
# 既定では **サービス内の全関数が1つのロールを共有する**ので、認可を一度も
# 通らない `getPhotos` / `getPhoto` が、写真テーブルの `PutItem`/`DeleteItem`、
# `uploads/*` の `s3:PutObject`/`DeleteObject`、そして
# `cognito-idp:AdminAddUserToGroup` まで持っていた。最後のものは
# PostConfirmation トリガー専用で、**IAM は GroupName を制限できない**
# （ハンドラ側が `user` 固定にしているのが唯一の歯止め）。
#
# この2つが実際に叩くのは読み取りだけ:
#   getPhotos  listPhotos（Scan）/ listPhotosByUser（索引の Query）
#   getPhoto   getPhotoById（GetItem）
#
# 書き込みは1つも無い。users テーブル・S3・Cognito にも触らない。
resources:
  Resources:
    # Apple でサインインの入口（`appleSignIn`・未認証で呼べる）だけのロール。
    # 持たせるのは実際に叩くものだけ: そのプールの利用者を探す・作る・属性を書く・
    # パスワードを確定する・`user` グループに入れる（無ければ作る）、users テーブルの PutItem
    # （プロフィール行）。写真テーブル・S3・削除の権限は持たない
    AppleSignInRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-${aws:region}-appleSignIn
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: appleSignIn
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - cognito-idp:ListUsers
                    - cognito-idp:AdminCreateUser
                    - cognito-idp:AdminSetUserPassword
                    - cognito-idp:AdminUpdateUserAttributes
                    - cognito-idp:AdminAddUserToGroup
                    - cognito-idp:CreateGroup
                  Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}

    # カスタム認証のトリガー3本のロール。**ログだけ**（Apple の公開鍵を読むのは外への https で、
    # AWS の権限は要らない）
    CognitoChallengeRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-${aws:region}-cognitoChallenge
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: cognitoChallenge
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*

    PublicReadRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-${aws:region}-publicRead
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: publicRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # ログ。これが無いと失敗の理由がどこにも残らない
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:Query
                    # 公開一覧は全表 Scan（写真以外も同居しているので
                    # 絞り込みは読んだあとに効く）。GSI に移すまではこのまま
                    - dynamodb:Scan
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
