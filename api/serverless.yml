service: photo-gallery-api

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1

  environment:
    PHOTOS_TABLE: prod-photo-gallery-photos
    USERS_TABLE: prod-photo-gallery-users
    UPLOAD_BUCKET: ${param:uploadBucket, 'prod-journey-photo-upload'}
    CLOUDFRONT_URL: ${param:cloudfrontUrl, 'https://d1s3dwwzgxf5ni.cloudfront.net'}

  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${param:cognitoUserPoolId}
        audience:
          - ${param:cognitoClientId}

  iam:
    role:
      statements:
        # 写真データ DynamoDB CRUD
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-photos
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-photos/index/*
        # 登録完了時にプロフィール行を作る（PostConfirmation トリガー）
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/prod-photo-gallery-users
        # アップロード画像の管理（Presigned URL 発行・削除）
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${param:uploadBucket, 'prod-journey-photo-upload'}/*
        # PostConfirmation トリガー: 確認済みユーザーを user グループへ追加
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
          Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  getPhotos:
    handler: src/photos.getPhotos
    events:
      - httpApi:
          path: /photos
          method: GET

  getPhoto:
    handler: src/photos.getPhoto
    events:
      - httpApi:
          path: /photos/{id}
          method: GET

  # 管理画面用。下書きも返すので必ず認証を要求する（ハンドラ側でも admin を確認）
  getPhotosForAdmin:
    handler: src/photos.getPhotosForAdmin
    events:
      - httpApi:
          path: /admin/photos
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updatePhoto:
    handler: src/photosMutate.updatePhoto
    events:
      - httpApi:
          path: /photos/{id}
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  deletePhoto:
    handler: src/photosMutate.deletePhoto
    events:
      - httpApi:
          path: /photos/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  presignedUrl:
    handler: src/upload.presignedUrl
    events:
      - httpApi:
          path: /upload/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  savePhoto:
    handler: src/upload.savePhoto
    events:
      - httpApi:
          path: /upload/save
          method: POST
          authorizer:
            name: cognitoAuthorizer

  postConfirmation:
    handler: src/cognitoTrigger.postConfirmation
    events:
      - cognitoUserPool:
          pool: prod-journey-photo-client-spa
          trigger: PostConfirmation
          existing: true
