service: photo-gallery-api

frameworkVersion: '3'

plugins:
  - serverless-esbuild

provider:
  name: aws
  runtime: nodejs22.x
  region: ap-northeast-1

  # 環境ごとの値。既定値は置かない——未指定ならデプロイを失敗させる。
  # 以前はテーブル名がリテラルの prod-... で、--stage を変えても
  # 読み書き先が本番のままだった（ステージングを作ると本番を壊す状態）。
  environment:
    PHOTOS_TABLE: ${param:photosTable}
    USERS_TABLE: ${param:usersTable}
    # 再ビルド依頼の設定（REBUILD_*）はここには置かない。**GitHub の書き込み
    # トークンなので、provider に置くと全関数の環境変数に入る**（IAM-2）。
    # 実際に頼むのは api-user で3つ・api で2つだけなので、その関数にだけ配る。
    # 環境変数は `lambda:GetFunctionConfiguration`（読み取り権）で誰でも読めて、
    # そこからリポジトリへの書き込み → デプロイ鍵、と輪が閉じる。
    # 未認証で呼べる口にまで配る理由は無い。
    UPLOAD_BUCKET: ${param:uploadBucket}
    CLOUDFRONT_URL: ${param:cloudfrontUrl}
    # 管理者削除でエッジの掃除に使う（LEFT-4）。**秘密ではない**ので
    # provider に置く（配信IDは CLAUDE.md にも書いてある。IAM-2 が
    # 関数ごとに配れと言っているのは GitHub の書き込みトークンの話）。
    # api-user 側と同じ形。未設定なら `invalidateUploads` が警告1行で
    # 飛ばす——設定漏れで削除そのものを止めない
    CLOUDFRONT_DISTRIBUTION_ID: ${param:cloudfrontDistributionId, ''}

  httpApi:
    cors: true
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://cognito-idp.${aws:region}.amazonaws.com/${param:cognitoUserPoolId}
        audience:
          - ${param:cognitoClientId}

  iam:
    role:
      statements:
        # 写真データ DynamoDB CRUD
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
        # 登録完了時にプロフィール行を作る（PostConfirmation トリガー）
        - Effect: Allow
          Action:
            - dynamodb:PutItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:usersTable}
        # アップロード画像の管理（Presigned URL 発行・削除）。
        # uploads/ 配下に限る。バケット全体を許すと profiles/*（他人のアイコン）
        # まで届き、ハンドラ側の uploads/ チェック1か所が唯一の防波堤になる。
        # api-user 側は最初からこの粒度で切ってある。
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${param:uploadBucket}/uploads/*
        # 公開範囲を絞った写真の置き場（api-user の `privateMove.ts` が移す）。
        # 管理者の削除で消せないと、実体だけが残る。**消すだけ**（書かない）
        - Effect: Allow
          Action:
            - s3:DeleteObject
          Resource: arn:aws:s3:::${param:uploadBucket}/private/*
        # 管理者削除で消した実体を、エッジからも消す（LEFT-4）。
        # アップロードは max-age=31536000（1年）で配っていて、`/uploads/*` の
        # maxTTL も 31536000（本番実測 2026-09-05）。S3 から消すだけでは
        # **URL を知っていれば最大1年 取れ続ける**（GPS 入りの原本も同じ）。
        # api-user 側は前から持っていて、こちらだけ無かった。
        # 対象はこのアカウントの配信のみ。作成しかできない（読み書きは無い）。
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
          Resource:
            - arn:aws:cloudfront::${aws:accountId}:distribution/*
        # PostConfirmation トリガー: 確認済みユーザーを user グループへ追加
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
            # グループが無ければ作る（無いと新規登録した人が全員、投稿を開けない）
            - cognito-idp:CreateGroup
          Resource: arn:aws:cognito-idp:${aws:region}:${aws:accountId}:userpool/${param:cognitoUserPoolId}

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    target: node22
    platform: node
    exclude:
      - '@aws-sdk/*'

functions:
  getPhotos:
    handler: src/photos.getPhotos
    # 未認証で呼べる口。既定の共有ロール（削除・Cognito つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /photos
          method: GET

  getPhoto:
    handler: src/photos.getPhoto
    # 未認証で呼べる口。既定の共有ロール（削除・Cognito つき）ではなく読み取り専用へ
    role: PublicReadRole
    events:
      - httpApi:
          path: /photos/{id}
          method: GET

  # 管理画面用。下書きも返すので必ず認証を要求する（ハンドラ側でも admin を確認）
  getPhotosForAdmin:
    handler: src/photos.getPhotosForAdmin
    events:
      - httpApi:
          path: /admin/photos
          method: GET
          authorizer:
            name: cognitoAuthorizer

  updatePhoto:
    # ここも再ビルドを頼む（api/src/photosMutate.ts の updatePhoto）。
    # 既定の6秒のままだと、GitHub が黙っているときに**編集は保存済みなのに
    # 500 が返る**。しかも殺されると印と予算の解放に到達しない。
    timeout: 15
    handler: src/photosMutate.updatePhoto
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /photos/{id}
          method: PUT
          authorizer:
            name: cognitoAuthorizer

  deletePhoto:
    # 実体を消したあとに静的サイトの再ビルドを頼む（外部への HTTP）。
    # 既定の6秒だと、GitHub が遅いだけで**データはもう消えているのに
    # 500 が返る**（押し直すと今度は 404）。Lambda は実際に使った時間
    # だけ課金されるので、広げても普段の費用は変わらない。
    timeout: 15
    handler: src/photosMutate.deletePhoto
    environment:
      # 再ビルド依頼はこの関数から出す（provider には置かない。IAM-2）
      REBUILD_REPO: ${param:rebuildRepo, ''}
      REBUILD_DISPATCH_TOKEN: ${param:rebuildToken, ''}
      REBUILD_MONTHLY_MAX: ${param:rebuildMonthlyMax, ''}
    events:
      - httpApi:
          path: /photos/{id}
          method: DELETE
          authorizer:
            name: cognitoAuthorizer

  presignedUrl:
    handler: src/upload.presignedUrl
    events:
      - httpApi:
          path: /upload/presigned-url
          method: POST
          authorizer:
            name: cognitoAuthorizer

  savePhoto:
    handler: src/upload.savePhoto
    events:
      - httpApi:
          path: /upload/save
          method: POST
          authorizer:
            name: cognitoAuthorizer

  postConfirmation:
    handler: src/cognitoTrigger.postConfirmation
    events:
      # ⚠️ existing: true は「既にあるプールを書き換える」。プール名を間違えると
      # 別環境のプールのトリガーを奪う（本番の新規登録が壊れる）。既定値は置かない。
      - cognitoUserPool:
          pool: ${param:cognitoPoolName}
          trigger: PostConfirmation
          existing: true

# ---------------------------------------------------------------------------
# 未認証で呼べる2つの口だけ、専用の最小ロールに分ける（IAM-1。api-user 側と対）
#
# 既定では **サービス内の全関数が1つのロールを共有する**ので、認可を一度も
# 通らない `getPhotos` / `getPhoto` が、写真テーブルの `PutItem`/`DeleteItem`、
# `uploads/*` の `s3:PutObject`/`DeleteObject`、そして
# `cognito-idp:AdminAddUserToGroup` まで持っていた。最後のものは
# PostConfirmation トリガー専用で、**IAM は GroupName を制限できない**
# （ハンドラ側が `user` 固定にしているのが唯一の歯止め）。
#
# この2つが実際に叩くのは読み取りだけ:
#   getPhotos  listPhotos（Scan）/ listPhotosByUser（索引の Query）
#   getPhoto   getPhotoById（GetItem）
#
# 書き込みは1つも無い。users テーブル・S3・Cognito にも触らない。
resources:
  Resources:
    PublicReadRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${sls:stage}-${aws:region}-publicRead
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: publicRead
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # ログ。これが無いと失敗の理由がどこにも残らない
                - Effect: Allow
                  Action:
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*:*
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:Query
                    # 公開一覧は全表 Scan（写真以外も同居しているので
                    # 絞り込みは読んだあとに効く）。GSI に移すまではこのまま
                    - dynamodb:Scan
                  Resource:
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}
                    - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${param:photosTable}/index/*
